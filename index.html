<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>策略 PMO 工作台</title>
  <meta name="description" content="個人用的策略 PMO 工作台：快速記錄、排優先順序、追蹤回覆、例行事項、領先與落後指標、成果紀錄、Google 日曆同步與 AI 諮詢。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
  <style>
/* 策略 PMO 工作台
   Layout: left sidebar navigation + main column; collapses to a slide-in drawer under 860px. */
:root {
  --bg: #eef1f0;
  --surface: #f9fbfa;
  --surface-2: #e4eae8;
  --ink: #1d2826;
  --muted: #5b6966;
  --line: #d2dad7;
  --accent: #2f6b62;
  --accent-ink: #ffffff;
  --accent-soft: #d9e8e4;
  --warm: #a3643a;
  --warm-soft: #f3e6dc;
  --ok: #2e7d4f;
  --ok-soft: #dcefe3;
  --warn: #a8700c;
  --warn-soft: #f6ead0;
  --bad: #b23a3a;
  --bad-soft: #f5dddd;
  --shadow: 0 1px 2px rgba(20, 40, 36, .06), 0 4px 16px rgba(20, 40, 36, .06);
  --display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131918; --surface: #1b2321; --surface-2: #232d2b; --ink: #e2eae7; --muted: #98a7a3;
    --line: #2e3a37; --accent: #7cc0b3; --accent-ink: #0f1a18; --accent-soft: #22362f;
    --warm: #e0a172; --warm-soft: #33261d; --ok: #6cc28f; --ok-soft: #1d3326; --warn: #e2b452;
    --warn-soft: #382d16; --bad: #ec8a8a; --bad-soft: #3a1f1f; --shadow: 0 1px 2px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131918; --surface: #1b2321; --surface-2: #232d2b; --ink: #e2eae7; --muted: #98a7a3;
  --line: #2e3a37; --accent: #7cc0b3; --accent-ink: #0f1a18; --accent-soft: #22362f;
  --warm: #e0a172; --warm-soft: #33261d; --ok: #6cc28f; --ok-soft: #1d3326; --warn: #e2b452;
  --warn-soft: #382d16; --bad: #ec8a8a; --bad-soft: #3a1f1f; --shadow: 0 1px 2px rgba(0,0,0,.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 15px; line-height: 1.65;
}
a { color: var(--accent); }
h1, h2, h3 { text-wrap: balance; line-height: 1.3; }
h1 { font-family: var(--display); font-size: 1.7rem; margin: 0; }
h2 { font-family: var(--display); font-size: 1.2rem; margin: 0 0 12px; }
h3 { font-size: 1rem; margin: 0 0 6px; }
[hidden] { display: none !important; }

/* App shell */
.app { display: grid; grid-template-columns: 240px 1fr; min-height: 100%; }
.nav {
  background: var(--surface); border-right: 1px solid var(--line);
  padding: 20px 14px calc(32px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px;
  position: sticky; top: 0; height: 100vh; height: 100dvh; overflow-y: auto; overscroll-behavior: contain;
}
.brand { display: flex; gap: 10px; align-items: center; padding: 0 6px; }
.brand-mark {
  width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; font-family: var(--display); font-weight: 700;
}
.brand-name { font-family: var(--display); font-weight: 700; }
.brand-sub { font-size: .78rem; color: var(--muted); }
nav { display: flex; flex-direction: column; gap: 12px; }
nav a, .nav-add {
  display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px;
  color: var(--ink); text-decoration: none; font: inherit; background: none; border: 0; text-align: left; cursor: pointer; width: 100%;
}
nav a:hover, .nav-add:hover { background: var(--surface-2); }
nav a.active { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-label { font-size: .72rem; letter-spacing: .1em; color: var(--muted); padding: 0 10px 4px; }
.nav-add { color: var(--muted); font-size: .9rem; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; gap: 12px; padding-block: 12px;
  padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--bg); position: sticky; top: 0; z-index: 5;
}
.topbar-title { font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar-right { font-size: .85rem; display: flex; gap: 12px; align-items: center; }
.topbar-gear { text-decoration: none; font-size: 1.1rem; line-height: 1; color: var(--muted); padding: 4px; border-radius: 6px; }
.topbar-gear:hover { color: var(--accent); background: var(--surface-2); }
.menu-btn { display: none; font-size: 1.2rem; background: none; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); padding: 2px 10px; cursor: pointer; }
#view {
  padding-block: 24px 64px;
  padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
  max-width: 1180px; width: 100%; outline: none;
  display: flex; flex-direction: column; gap: 24px;
}

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .nav {
    position: fixed; top: 0; bottom: 0; left: 0; height: auto; width: min(280px, 85vw); z-index: 20; transform: translateX(-100%);
    transition: transform .2s ease; box-shadow: var(--shadow);
    padding-top: calc(20px + env(safe-area-inset-top, 0px));
    padding-left: max(14px, env(safe-area-inset-left, 0px));
  }
  .nav-backdrop { position: fixed; inset: 0; background: rgba(10, 20, 18, .35); z-index: 15; }
  .nav.open { transform: none; }
  .menu-btn { display: inline-block; }
  .topbar { top: env(safe-area-inset-top, 0px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #view { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
@media (prefers-reduced-motion: reduce) { .nav { transition: none; } }

/* Building blocks */
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.page-head p { margin: 4px 0 0; color: var(--muted); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.panel-head h2 { margin: 0; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.grid-2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.empty { color: var(--muted); padding: 12px 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }

.btn {
  font: inherit; font-size: .9rem; border-radius: 8px; padding: 6px 14px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.05); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 3px 10px; font-size: .82rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}

.pill { display: inline-flex; align-items: center; gap: 4px; font-size: .78rem; padding: 1px 9px; border-radius: 999px; white-space: nowrap; }
.pill.on { background: var(--ok-soft); color: var(--ok); }
.pill.risk { background: var(--warn-soft); color: var(--warn); }
.pill.off { background: var(--bad-soft); color: var(--bad); }
.pill.done { background: var(--surface-2); color: var(--muted); }
.pill.H { background: var(--bad-soft); color: var(--bad); }
.pill.M { background: var(--warn-soft); color: var(--warn); }
.pill.L { background: var(--surface-2); color: var(--muted); }
.pill.tag { background: var(--accent-soft); color: var(--accent); }

/* BU cards */
.bu-card { display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: inherit; border-left: 4px solid var(--c, var(--accent)); }
.bu-card:hover { box-shadow: var(--shadow); }
.bu-card .counts { display: flex; gap: 6px; flex-wrap: wrap; }
.stat-row { display: flex; gap: 20px; flex-wrap: wrap; }
.stat b { display: block; font-size: 1.6rem; font-family: var(--display); font-variant-numeric: tabular-nums; }
.stat span { font-size: .82rem; color: var(--muted); }

/* Lists */
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.list li { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-top: 1px solid var(--line); min-width: 0; }
.list li:first-child { border-top: 0; }
.list .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.date { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .85rem; white-space: nowrap; min-width: 84px; }
.date.over { color: var(--bad); font-weight: 500; }
.check { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--accent); flex: none; }
.done-text { text-decoration: line-through; color: var(--muted); }

/* Project rows */
.proj-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 0; border-top: 1px solid var(--line); text-decoration: none; color: inherit; }
.proj-row:first-child { border-top: 0; }
.proj-row:hover .proj-name { color: var(--accent); }
.proj-name { font-weight: 500; }
.proj-meta { grid-column: 1 / -1; font-size: .85rem; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
.progress { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; grid-column: 1 / -1; }
.progress i { display: block; height: 100%; background: var(--accent); }

/* Tables */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 500; color: var(--muted); font-size: .8rem; white-space: nowrap; }
td.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }

/* Forms */
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; min-width: 0; }
.field label { font-size: .85rem; color: var(--muted); }
.field-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0 12px; }
input[type="text"], input[type="date"], input[type="number"], input[type="password"], input[type="url"], select, textarea {
  font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 8px; padding: 7px 10px; width: 100%; min-width: 0;
}
textarea { resize: vertical; min-height: 80px; }
input[type="color"] { width: 48px; height: 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 2px; }
.hint { font-size: .8rem; color: var(--muted); }
code, .mono { font-family: var(--mono); font-size: .85em; }
pre.out {
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow: auto;
  max-height: 360px; font-family: var(--mono); font-size: .82rem; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0;
}

/* Modal */
dialog {
  border: 1px solid var(--line); border-radius: 14px; padding: 0; background: var(--surface); color: var(--ink);
  width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px); box-shadow: var(--shadow);
}
dialog::backdrop { background: rgba(10, 20, 18, .45); }
dialog form { padding: 20px; display: flex; flex-direction: column; }
#modal-body { overflow-y: auto; max-height: calc(100vh - 220px); padding-right: 2px; }
.modal-actions { display: flex; gap: 8px; margin-top: 8px; }
.spacer { flex: 1; }

/* Toast */
#toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: .9rem;
  opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50; max-width: calc(100vw - 32px);
}
#toast.show { opacity: 1; }

/* Notice */
.notice { border-radius: 10px; padding: 12px 14px; font-size: .9rem; background: var(--warm-soft); color: var(--ink); border: 1px solid var(--line); }
.notice b { color: var(--warm); }
.notice.ok { background: var(--ok-soft); }

/* Rituals */
.ritual-focus { background: var(--accent-soft); border-color: transparent; }
.ritual-focus label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; padding: 6px 0; }
.quote { font-family: var(--display); color: var(--accent); }
.force { display: flex; flex-direction: column; gap: 10px; }
.force-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; }
.force-row .bar { grid-column: 1 / -1; height: 7px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.force-row .bar i { display: block; height: 100%; background: var(--accent); }
details.ref { border-top: 1px solid var(--line); padding: 10px 0; }
details.ref:first-of-type { border-top: 0; }
details.ref summary { cursor: pointer; font-weight: 500; }
details.ref ul, details.ref ol { margin: 6px 0 0; padding-left: 1.3em; }

/* AI chat */
.chat { display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); }
.msg.assistant { align-self: flex-start; background: var(--surface-2); }
.msg.error { align-self: stretch; background: var(--bad-soft); color: var(--bad); max-width: none; }
.chat-input { display: flex; gap: 8px; align-items: flex-end; }
.chat-input textarea { min-height: 60px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font: inherit; font-size: .82rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 3px 11px; cursor: pointer; }
.chip:hover { border-color: var(--accent); color: var(--accent); }

/* ---- v2: rows, capture, matrix, indicators ---- */
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.dot.big { width: 12px; height: 12px; display: inline-block; margin-right: 10px; vertical-align: middle; }
.row-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 3px; }
.unit-tag { display: inline-flex; align-items: center; gap: 5px; font-size: .78rem; color: var(--muted); }
.unit-tag .dot { width: 7px; height: 7px; }
.list li .btn { flex: none; }
ul.plain { margin: 0; padding-left: 1.2em; }
ul.plain li { margin: 4px 0; }

.capture { padding: 12px; }
.capture-form { display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; }
.capture-form input { font-size: 1rem; }
@media (max-width: 640px) { .capture-form { grid-template-columns: 1fr 1fr; } .capture-form input { grid-column: 1 / -1; } .capture-form .btn { grid-column: 1 / -1; } }
.focus-panel { border-color: var(--accent); }

.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.toolbar select { width: auto; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface); }
.seg button { font: inherit; font-size: .88rem; border: 0; background: none; color: var(--ink); padding: 6px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent); color: var(--accent-ink); }

.quad-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 760px) { .quad-grid { grid-template-columns: 1fr; } }
.quad { border-top: 4px solid var(--line); }
.quad-do { border-top-color: var(--bad); }
.quad-plan { border-top-color: var(--accent); }
.quad-quick { border-top-color: var(--warn); }
.quad-later { border-top-color: var(--line); }
.quad h2 .small { font-family: var(--body); font-weight: 400; }

.pill.lead { background: var(--accent-soft); color: var(--accent); }
.pill.lag { background: var(--surface-2); color: var(--ink); }
.light-pill { display: inline-flex; align-items: center; gap: 5px; font-size: .78rem; padding: 1px 9px; border-radius: 999px; white-space: nowrap; }
.light-pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.light-pill.ok { background: var(--ok-soft); color: var(--ok); }
.light-pill.warn { background: var(--warn-soft); color: var(--warn); }
.light-pill.bad { background: var(--bad-soft); color: var(--bad); }
.light-pill.none { background: var(--surface-2); color: var(--muted); }
.c-ok { color: var(--ok); } .c-warn { color: var(--warn); } .c-bad { color: var(--bad); }

.ind-card { display: flex; flex-direction: column; gap: 8px; border-left: 4px solid var(--line); }
.ind-card.light-ok { border-left-color: var(--ok); }
.ind-card.light-warn { border-left-color: var(--warn); }
.ind-card.light-bad { border-left-color: var(--bad); }
.ind-card h3 { margin: 0; }
.ind-head { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.ind-head .light-pill { margin-left: auto; }
.ind-value { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.ind-value b { font-family: var(--display); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.trend { font-size: .8rem; color: var(--muted); }
.trend.up { color: var(--ok); } .trend.down { color: var(--bad); }
.spark { width: 100%; max-width: 100%; height: 40px; display: block; }
.spark-line { stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.spark-target { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.spark-dot { fill: var(--accent); }
.spark-empty { height: 40px; display: flex; align-items: center; }

.mini-stats { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; font-size: .88rem; color: var(--muted); }
.mini-stats b { color: var(--ink); font-variant-numeric: tabular-nums; }

.bars { display: flex; flex-direction: column; gap: 4px; }
.bar-row { display: grid; grid-template-columns: 9em 1fr 2em; gap: 10px; align-items: center; font: inherit; font-size: .9rem; color: var(--ink);
  background: none; border: 0; padding: 4px 6px; border-radius: 6px; cursor: pointer; text-align: left; }
.bar-row:hover, .bar-row.on { background: var(--surface-2); }
.bar-track { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.bar-row:hover .bar-track, .bar-row.on .bar-track { background: var(--bg); }
.bar-track i { display: block; height: 100%; background: var(--accent); }
@media (max-width: 480px) { .bar-row { grid-template-columns: 7.5em 1fr 1.6em; } }

/* Row actions wrap below the text when the row is narrow, instead of squeezing it */
.list li { flex-wrap: wrap; }
.list li .grow { flex: 1 1 160px; }
.row-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; align-items: flex-start; }
@media (max-width: 640px) {
  .date { min-width: 64px; }
  .list li .grow { flex-basis: 140px; }
}

/* ---- Phone comfort: no zoom on focus, nothing sticky in the way, bigger touch targets, steady dialogs ---- */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, a, input, select, label { touch-action: manipulation; }
@media (max-width: 640px) {
  /* iOS zooms the page when a field under 16px gets focus; that zoom is what makes the page feel like it floats */
  input[type="text"], input[type="date"], input[type="number"], input[type="password"], input[type="url"], select, textarea { font-size: 16px; }
  .topbar { position: static; }
  .btn { min-height: 40px; padding: 8px 14px; }
  .btn.sm { min-height: 36px; padding: 6px 12px; font-size: .88rem; }
  .row-actions { gap: 8px; }
  .check { width: 22px; height: 22px; margin-top: 1px; }
  .list li { padding: 12px 0; gap: 10px 12px; }
  .seg button { padding: 9px 12px; }
  .chip { padding: 7px 12px; }
  nav a, .nav-add { padding: 10px 10px; }

/* ---- js/util.js ---- */
/* Shared helpers. Everything hangs off one global namespace so the app also runs from file:// without a build step. */
window.PMO = window.PMO || {};

PMO.util = (function () {
  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function uid(prefix) {
    return (prefix || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  // Local calendar date as YYYY-MM-DD (not UTC, so late-night entries land on the right day).
  function today() {
    const d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function addDays(dateStr, n) {
    const d = parseDate(dateStr);
    d.setDate(d.getDate() + n);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function parseDate(s) {
    const [y, m, d] = String(s).split('-').map(Number);
    return new Date(y, (m || 1) - 1, d || 1);
  }

  function daysBetween(a, b) {
    return Math.round((parseDate(b) - parseDate(a)) / 86400000);
  }

  function fmtDate(s) {
    if (!s) return '—';
    const d = parseDate(s);
    return d.getFullYear() + '/' + pad(d.getMonth() + 1) + '/' + pad(d.getDate());
  }

  // ISO week key, e.g. 2026-W42
  function weekKey(dateStr) {
    const d = parseDate(dateStr || today());
    const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const day = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - day);
    const yearStart = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    const week = Math.ceil(((t - yearStart) / 86400000 + 1) / 7);
    return t.getUTCFullYear() + '-W' + pad(week);
  }

  function download(filename, content, mime) {
    const blob = new Blob([content], { type: mime || 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  async function copy(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
      ta.remove();
      return ok;
    }
  }

  function readFile(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = () => reject(r.error);
      r.readAsText(file);
    });
  }

  return { esc, uid, today, addDays, parseDate, daysBetween, fmtDate, weekKey, download, copy, readFile, pad };
})();

</script>

    out.rituals = Object.assign({ days: {}, weeks: {} }, out.rituals || {});
    out.meta = Object.assign(base.meta, out.meta || {});
    out.schema = SCHEMA;
    return out;
  }

  let data = readJSON(DATA_KEY);
  data = data ? normalize(data) : sample();
  const storedSettings = readJSON(SETTINGS_KEY) || {};
  let settings = Object.assign({}, defaultSettings, storedSettings);
  settings.gcalInclude = Object.assign({}, defaultSettings.gcalInclude, storedSettings.gcalInclude || {});
  let saveOk = writeJSON(DATA_KEY, data);

  function save() {
    data.meta.updated = new Date().toISOString();
    saveOk = writeJSON(DATA_KEY, data);
    listeners.forEach(fn => fn());
    return saveOk;
  }
  function saveSettings() { return writeJSON(SETTINGS_KEY, settings); }
  function onChange(fn) { listeners.push(fn); }

  // Queries
  function bu(id) { return data.bus.find(b => b.id === id); }
  function activeBus() { return data.bus.filter(b => !b.archived); }
  function buName(id) { const b = bu(id); return b ? b.name : '不分單位'; }
  function project(id) { return data.projects.find(p => p.id === id); }
  function projectsOf(buId) { return data.projects.filter(p => p.buId === buId); }
  function unitOptions(includeNone) {
    const opts = data.bus.filter(b => !b.archived).map(b => ({ value: b.id, label: b.name }));
    return includeNone ? [{ value: '', label: '不分單位' }].concat(opts) : opts;
  }

  function allMilestones() {
    const out = [];
    data.projects.forEach(p => (p.milestones || []).forEach(m => out.push({ m, p, b: bu(p.buId) })));
    return out.sort((a, b) => String(a.m.date).localeCompare(String(b.m.date)));
  }

  function progress(p) {
    const ms = p.milestones || [];
    if (!ms.length) return p.status === 'done' ? 100 : 0;
    return Math.round(ms.filter(m => m.done).length / ms.length * 100);
  }

  /* Task priority. Urgent = due within 2 days or overdue. Score combines importance, urgency and effort (quick wins float up). */
  function taskUrgent(t) {
    if (!t.due) return false;
    return PMO.util.daysBetween(today(), t.due) <= 2;
  }
  function quadrant(t) {
    const imp = t.importance === 'H';
    const urg = taskUrgent(t);
    if (imp && urg) return 'do';
    if (imp) return 'plan';
    if (urg) return 'quick';
    return 'later';
  }
  function taskScore(t) {
    const imp = { H: 3, M: 2, L: 1 }[t.importance] || 1;
    let urg = 0;
    if (t.due) {
      const d = PMO.util.daysBetween(today(), t.due);
      urg = d < 0 ? 4 : d === 0 ? 3.5 : d <= 2 ? 3 : d <= 7 ? 2 : d <= 14 ? 1 : 0;
    }
    const eff = { S: 1, M: 0, L: -1 }[t.effort] || 0;
    return Math.round((imp * 3 + urg * 2 + eff) * 10) / 10;
  }

  /* Routines: next due date from cadence + lastDone. weekly → day = 1..7 (Mon..Sun); monthly/quarterly → day of month. */
  function routineNext(r) {
    const t = today();
    const { parseDate, pad } = PMO.util;
    const fmt = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    const from = r.lastDone ? addDays(r.lastDone, 1) : t;
    const start = parseDate(from);
    if (r.cadence === 'weekly') {
      const want = Number(r.day) || 1;
      const d = new Date(start);
      for (let i = 0; i < 8; i++) {
        const wd = d.getDay() || 7;
        if (wd === want) return fmt(d);
        d.setDate(d.getDate() + 1);
      }
      return fmt(d);
    }
    const step = r.cadence === 'quarterly' ? 3 : 1;
    const day = Math.min(Math.max(Number(r.day) || 1, 1), 28);
    let d = new Date(start.getFullYear(), start.getMonth(), day);
    if (r.cadence === 'quarterly') {
      // Quarter months: Jan, Apr, Jul, Oct
      while (d.getMonth() % 3 !== 0 || d < start) d = new Date(d.getFullYear(), d.getMonth() + 1, day);
    } else {
      if (d < start) d = new Date(d.getFullYear(), d.getMonth() + step, day);
    }
    return fmt(d);
  }

  /* Indicator light: ok / warn / bad / none, based on the latest value vs target. */
  function indicatorLatest(i) {
    const vs = (i.values || []).slice().sort((a, b) => String(a.period).localeCompare(String(b.period)));
    return vs.length ? vs[vs.length - 1] : null;
  }
  function indicatorLight(i) {
    const last = indicatorLatest(i);
    if (!last || i.target == null || i.target === '' || last.value == null) return 'none';
    const v = Number(last.value), tgt = Number(i.target);
    const warn = Math.abs(Number(i.warnPct) || 0) / 100;
    if (i.direction === 'down') {
      if (v <= tgt) return 'ok';
      const limit = tgt === 0 ? (Number(i.warnPct) || 0) : tgt * (1 + warn);
      return v <= limit ? 'warn' : 'bad';
    }
    if (v >= tgt) return 'ok';
    return v >= tgt * (1 - warn) ? 'warn' : 'bad';
  }
  function indicatorTrend(i) {
    const vs = (i.values || []).slice().sort((a, b) => String(a.period).localeCompare(String(b.period)));
    if (vs.length < 2) return 0;
    const diff = Number(vs[vs.length - 1].value) - Number(vs[vs.length - 2].value);
    const good = i.direction === 'down' ? -diff : diff;
    return good > 0 ? 1 : good < 0 ? -1 : 0;
  }

  // Mutations
  function upsert(list, item) {
    const i = list.findIndex(x => x.id === item.id);
    if (i >= 0) list[i] = Object.assign(list[i], item); else list.push(item);
    return item;
  }
  function removeBu(id) {
    data.bus = data.bus.filter(b => b.id !== id);
    data.projects = data.projects.filter(p => p.buId !== id);
    data.questions = data.questions.filter(q => q.buId !== id);
    ['tasks', 'followups', 'routines', 'indicators', 'wins'].forEach(k => data[k].forEach(x => { if (x.buId === id) x.buId = ''; }));
  }
  function replaceAll(newData) { data = normalize(newData); save(); }
  function reset(withSample) { data = withSample ? sample() : emptyData(); save(); }

  return {
    STATUS, LEVEL, UNIT_TYPE, BSC, COMPETENCIES,
    get data() { return data; },
    get settings() { return settings; },
    get saveOk() { return saveOk; },
    save, saveSettings, onChange,
    bu, activeBus, buName, unitOptions, project, projectsOf, allMilestones, progress,
    quadrant, taskScore, taskUrgent, routineNext, indicatorLatest, indicatorLight, indicatorTrend,
    upsert, removeBu, replaceAll, reset, normalize
  };
})();

/* ---- js/ui.js ---- */
/* UI helpers: toast, modal forms, status pills. */
PMO.ui = (function () {
  const { esc } = PMO.util;
  let toastTimer;

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
  }

  function statusPill(s) {
    return `<span class="pill ${esc(s)}">${esc(PMO.store.STATUS[s] || s)}</span>`;
  }
  function levelPill(l) {
    return `<span class="pill ${esc(l)}">風險${esc(PMO.store.LEVEL[l] || l)}</span>`;
  }

  /* fields: [{name,label,type,value,options,hint,required,placeholder,row}]
     Returns a promise of the submitted values, 'delete', or null when cancelled. */
  function form({ title, fields, okText, allowDelete }) {
    const dlg = document.getElementById('modal');
    const body = document.getElementById('modal-body');
    const formEl = document.getElementById('modal-form');
    const delBtn = document.getElementById('modal-delete');
    const cancelBtn = document.getElementById('modal-cancel');
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-ok').textContent = okText || '儲存';
    delBtn.hidden = !allowDelete;

    const renderField = f => {
      const id = 'f_' + f.name;
      const req = f.required ? 'required' : '';
      let input;
      if (f.type === 'textarea') {
        input = `<textarea id="${id}" name="${esc(f.name)}" ${req} placeholder="${esc(f.placeholder || '')}">${esc(f.value || '')}</textarea>`;
      } else if (f.type === 'select') {
        input = `<select id="${id}" name="${esc(f.name)}">${f.options.map(o =>
          `<option value="${esc(o.value)}" ${String(o.value) === String(f.value) ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`;
      } else if (f.type === 'checkbox') {
        input = `<label class="small"><input type="checkbox" id="${id}" name="${esc(f.name)}" ${f.value ? 'checked' : ''}> ${esc(f.checkLabel || '')}</label>`;
      } else {
        input = `<input type="${esc(f.type || 'text')}" id="${id}" name="${esc(f.name)}" value="${esc(f.value == null ? '' : f.value)}" ${req} placeholder="${esc(f.placeholder || '')}" ${f.type === 'number' ? 'step="any"' : ''}>`;
      }
      return `<div class="field"><label for="${id}">${esc(f.label)}</label>${input}${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}</div>`;
    };

    // Group consecutive fields flagged with row:true into one responsive row.
    let html = '';
    let rowBuf = [];
    const flush = () => { if (rowBuf.length) { html += `<div class="field-row">${rowBuf.join('')}</div>`; rowBuf = []; } };
    fields.forEach(f => { if (f.row) rowBuf.push(renderField(f)); else { flush(); html += renderField(f); } });
    flush();
    body.innerHTML = html;

    return new Promise(resolve => {
      const cleanup = () => {
        formEl.onsubmit = null; delBtn.onclick = null; cancelBtn.onclick = null; dlg.onclose = null;
      };
      formEl.onsubmit = e => {
        e.preventDefault();
        const missing = fields.find(f => f.required && !String(formEl.elements[f.name].value || '').trim());
        if (missing) { toast('請填寫「' + missing.label + '」'); formEl.elements[missing.name].focus(); return; }
        const out = {};
        fields.forEach(f => {
          const el = formEl.elements[f.name];
          if (f.type === 'checkbox') out[f.name] = el.checked;
          else if (f.type === 'number') out[f.name] = el.value === '' ? null : Number(el.value);
          else out[f.name] = el.value.trim();
        });
        cleanup(); dlg.close(); resolve(out);
      };
      delBtn.onclick = () => {
        if (delBtn.dataset.armed === '1') {
          delBtn.dataset.armed = ''; delBtn.textContent = '刪除';
          cleanup(); dlg.close(); resolve('delete');
        } else {
          delBtn.dataset.armed = '1'; delBtn.textContent = '再按一次確認刪除';
        }
      };
      cancelBtn.onclick = () => { cleanup(); dlg.close(); resolve(null); };
      dlg.onclose = () => { cleanup(); resolve(null); };
      delBtn.dataset.armed = ''; delBtn.textContent = '刪除';
      dlg.showModal();
      // On phones, focusing a field opens the keyboard and shifts the dialog; let the person tap the field instead.
      const first = body.querySelector('input,select,textarea');
      if (first && !window.matchMedia('(max-width: 640px)').matches) first.focus();
    });
  }

  return { toast, statusPill, levelPill, form };
})();

/* ---- js/editors.js ---- */
/* Shared add/edit dialogs for every kind of record. Each returns the saved item, or null. */
PMO.edit = (function () {
  const S = PMO.store;
  const { uid, today, addDays } = PMO.util;
  const ui = PMO.ui;

  const IMPORTANCE = [{ value: 'H', label: '高：影響主管或單位的重點' }, { value: 'M', label: '中' }, { value: 'L', label: '低' }];
  const EFFORT = [{ value: 'S', label: '小：30 分鐘內' }, { value: 'M', label: '中：半天內' }, { value: 'L', label: '大：要排時間' }];

  function finish(list, cur, r, msgNew) {
    if (r === 'delete') {
      S.data[list] = S.data[list].filter(x => x.id !== cur.id);
      S.save(); ui.toast('已刪除');
      return null;
    }
    const item = S.upsert(S.data[list], Object.assign({ id: cur.id || uid(list.slice(0, 2)) }, cur.id ? {} : (cur.__defaults || {}), r));
    S.save(); ui.toast(cur.id ? '已更新' : msgNew);
    return item;
  }

  async function bu(existing) {
    const b = existing || {};
    const r = await ui.form({
      title: existing ? '編輯單位' : '新增單位',
      allowDelete: !!existing,
      fields: [
        { name: 'name', label: '名稱', value: b.name, required: true, placeholder: '例如：人資' },
        { name: 'type', label: '類型', type: 'select', value: b.type || 'hq', row: true,
          options: Object.keys(S.UNIT_TYPE).map(k => ({ value: k, label: S.UNIT_TYPE[k] })) },
        { name: 'color', label: '代表色', type: 'color', value: b.color || '#2f6b62', row: true },
        { name: 'owner', label: '單位主管', value: b.owner, row: true },
        { name: 'counterpart', label: '我的對口', value: b.counterpart, placeholder: '例如：單位企劃', row: true },
        { name: 'notes', label: '備註', type: 'textarea', value: b.notes, placeholder: '這個單位的重點、要注意的事' },
        { name: 'archived', label: '停用', type: 'checkbox', value: b.archived, checkLabel: '暫時不負責這個單位（資料保留，從選單隱藏）' }
      ]
    });
    if (!r) return null;
    if (r === 'delete') {
      S.removeBu(b.id); S.save(); ui.toast('已刪除「' + b.name + '」，相關任務改為不分單位');
      location.hash = '#/today';
      return null;
    }
    const item = S.upsert(S.data.bus, Object.assign({ id: b.id || uid('u') }, r));
    S.save(); ui.toast(existing ? '已更新' : '已新增「' + item.name + '」');
    return item;
  }

  async function project(buId, existing) {
    const p = existing || {};
    const r = await ui.form({
      title: existing ? '編輯專案' : '新增專案',
      allowDelete: !!existing,
      fields: [
        { name: 'name', label: '專案名稱', value: p.name, required: true },
        { name: 'buId', label: '單位', type: 'select', value: p.buId || buId, options: S.unitOptions(false).concat(
          p.buId && S.bu(p.buId) && S.bu(p.buId).archived ? [{ value: p.buId, label: S.buName(p.buId) + '（停用）' }] : []) },
        { name: 'status', label: '狀態', type: 'select', value: p.status || 'on', row: true, options: Object.keys(S.STATUS).map(k => ({ value: k, label: S.STATUS[k] })) },
        { name: 'stage', label: '階段', value: p.stage, placeholder: '例如：需求盤點', row: true },
        { name: 'owner', label: '負責人', value: p.owner || '我', row: true },
        { name: 'start', label: '開始', type: 'date', value: p.start || today(), row: true },
        { name: 'due', label: '到期', type: 'date', value: p.due || addDays(today(), 30), row: true },
        { name: 'summary', label: '摘要', type: 'textarea', value: p.summary, placeholder: '一兩句話說明目標和範圍' }
      ]
    });
    if (!r) return null;
    if (r === 'delete') {
      S.data.projects = S.data.projects.filter(x => x.id !== p.id);
      S.save(); ui.toast('已刪除專案');
      location.hash = '#/bu/' + p.buId;
      return null;
    }
    const item = S.upsert(S.data.projects, Object.assign({ id: p.id || uid('p'), milestones: [], risks: [], kpis: [], logs: [] }, r));
    S.save(); ui.toast(existing ? '已更新' : '已新增專案');
    return item;
  }

  async function task(existing, defaults) {
    const cur = Object.assign({}, existing || {}, { __defaults: { status: 'todo', created: today(), triaged: true } });
    const d = defaults || {};
    const r = await ui.form({
      title: existing ? (existing.triaged === false ? '整理這一則' : '編輯任務') : '新增任務',
      allowDelete: !!existing,
      fields: [
        { name: 'title', label: '要做什麼', value: cur.title, required: true },
        { name: 'buId', label: '單位', type: 'select', value: cur.buId != null ? cur.buId : (d.buId || ''), row: true, options: S.unitOptions(true) },
        { name: 'due', label: '截止日', type: 'date', value: cur.due || d.due || '', row: true },
        { name: 'importance', label: '重要性', type: 'select', value: cur.importance || 'M', row: true, options: IMPORTANCE },
        { name: 'effort', label: '花多少力氣', type: 'select', value: cur.effort || 'M', row: true, options: EFFORT },
        { name: 'status', label: '狀態', type: 'select', value: cur.status || 'todo', row: true,
          options: [{ value: 'todo', label: '待辦' }, { value: 'doing', label: '進行中' }, { value: 'done', label: '完成' }] },
        { name: 'notes', label: '備註', type: 'textarea', value: cur.notes }
      ]
    });
    if (!r) return null;
    if (r !== 'delete') { r.triaged = true; if (r.status === 'done' && !cur.doneOn) r.doneOn = today(); }
    return finish('tasks', cur, r, '已新增任務');
  }

  async function followup(existing, defaults) {
    const cur = existing || {};
    const d = defaults || {};
    const r = await ui.form({
      title: existing ? '編輯追蹤' : '新增等待回覆',
      allowDelete: !!existing,
      fields: [
        { name: 'what', label: '等什麼', value: cur.what || d.what, required: true, placeholder: '例如：月報欄位定義表' },
        { name: 'who', label: '跟誰要', value: cur.who, required: true, row: true },
        { name: 'channel', label: '管道', value: cur.channel, placeholder: 'Email、Teams、口頭', row: true },
        { name: 'buId', label: '單位', type: 'select', value: cur.buId != null ? cur.buId : (d.buId || ''), options: S.unitOptions(true) },
        { name: 'askedOn', label: '提出日', type: 'date', value: cur.askedOn || today(), row: true },
        { name: 'nudgeOn', label: '哪天提醒我追', type: 'date', value: cur.nudgeOn || addDays(today(), 3), row: true },
        { name: 'status', label: '狀態', type: 'select', value: cur.status || 'waiting', row: true,
          options: [{ value: 'waiting', label: '等待中' }, { value: 'done', label: '已收到' }] },
        { name: 'notes', label: '備註', type: 'textarea', value: cur.notes, placeholder: '追的時候可以怎麼說' }
      ]
    });
    if (!r) return null;
    return finish('followups', cur, r, '已加入等待回覆');
  }

  async function routine(existing) {
    const cur = existing || {};
    const r = await ui.form({
      title: existing ? '編輯例行事項' : '新增例行事項',
      allowDelete: !!existing,
      fields: [
        { name: 'title', label: '事項', value: cur.title, required: true, placeholder: '例如：月結後確認月報是否更新' },
        { name: 'buId', label: '單位', type: 'select', value: cur.buId || '', options: S.unitOptions(true) },
        { name: 'cadence', label: '頻率', type: 'select', value: cur.cadence || 'weekly', row: true,
          options: [{ value: 'weekly', label: '每週' }, { value: 'monthly', label: '每月' }, { value: 'quarterly', label: '每季（1、4、7、10 月）' }] },
        { name: 'day', label: '哪一天', type: 'number', value: cur.day || 1, row: true, hint: '每週填 1–7（週一到週日）；每月、每季填 1–28 號' },
        { name: 'notes', label: '備註', type: 'textarea', value: cur.notes }
      ]
    });
    if (!r) return null;
    return finish('routines', cur, r, '已新增例行事項');
  }

  async function indicator(existing, defaults) {
    const cur = Object.assign({}, existing || {}, { __defaults: { values: [] } });
    const d = defaults || {};
    const others = S.data.indicators.filter(i => i.id !== cur.id).map(i => ({ value: i.id, label: i.name }));
    const r = await ui.form({
      title: existing ? '編輯指標' : '新增指標',
      allowDelete: !!existing,
      fields: [
        { name: 'name', label: '指標名稱', value: cur.name, required: true },
        { name: 'kind', label: '類型', type: 'select', value: cur.kind || 'lag', row: true,
          options: [{ value: 'lead', label: '領先：提早看出趨勢' }, { value: 'lag', label: '落後：最後的結果' }] },
        { name: 'perspective', label: 'BSC 構面', type: 'select', value: cur.perspective || 'proc', row: true,
          options: Object.keys(S.BSC).map(k => ({ value: k, label: S.BSC[k] })) },
        { name: 'buId', label: '單位', type: 'select', value: cur.buId != null ? cur.buId : (d.buId || ''), row: true, options: S.unitOptions(true) },
        { name: 'unit', label: '單位（%、件、天）', value: cur.unit, row: true },
        { name: 'direction', label: '方向', type: 'select', value: cur.direction || 'up', row: true,
          options: [{ value: 'up', label: '越高越好' }, { value: 'down', label: '越低越好' }] },
        { name: 'target', label: '目標值', type: 'number', value: cur.target, row: true },
        { name: 'warnPct', label: '黃燈容許差距（%）', type: 'number', value: cur.warnPct != null ? cur.warnPct : 10, row: true,
          hint: '差距在這個範圍內是黃燈，超過是紅燈。目標是 0 的「越低越好」指標，這裡填可容許的數量。' },
        { name: 'driverOf', label: '它會影響哪個指標', type: 'select', value: cur.driverOf || '',
          options: [{ value: '', label: '無' }].concat(others), hint: '把領先指標連到它影響的落後指標，轉黃或轉紅時會提醒你。' },
        { name: 'notes', label: '備註', type: 'textarea', value: cur.notes, placeholder: '資料從哪裡來、怎麼算' }
      ]
    });
    if (!r) return null;
    return finish('indicators', cur, r, '已新增指標');
  }

  async function indicatorValue(ind) {
    const last = S.indicatorLatest(ind);
    const r = await ui.form({
      title: '記錄「' + ind.name + '」',
      fields: [
        { name: 'period', label: '日期', type: 'date', value: today(), row: true },
        { name: 'value', label: '數值' + (ind.unit ? '（' + ind.unit + '）' : ''), type: 'number', value: last ? last.value : '', required: true, row: true }
      ],
      okText: '記錄'
    });
    if (!r || r.value == null) return null;
    ind.values = (ind.values || []).filter(v => v.period !== r.period).concat([{ period: r.period, value: r.value }]);
    S.save(); ui.toast('已記錄');
    return ind;
  }

  async function win(existing) {
    const cur = Object.assign({}, existing || {}, { __defaults: {} });
    const r = await ui.form({
      title: existing ? '編輯成果' : '記一筆成果',
      allowDelete: !!existing,
      fields: [
        { name: 'title', label: '做了什麼', value: cur.title, required: true, placeholder: '例如：建立每月 KPI 燈號追蹤' },
        { name: 'date', label: '日期', type: 'date', value: cur.date || today(), row: true },
        { name: 'buId', label: '單位', type: 'select', value: cur.buId || '', row: true, options: S.unitOptions(true) },
        { name: 'impact', label: '帶來什麼結果', type: 'textarea', value: cur.impact, placeholder: '盡量具體：省了多少時間、讓誰可以做什麼決定。不要寫公司機密數字。' },
        { name: 'tags', label: '用到的能力（用逗號分隔）', value: (cur.tags || []).join('，'),
          hint: '可用：' + S.COMPETENCIES.join('、') },
        { name: 'english', label: '英文版一句話（選填）', type: 'textarea', value: cur.english, placeholder: 'Built a monthly KPI tracker that…' }
      ]
    });
    if (!r) return null;
    if (r !== 'delete') r.tags = r.tags.split(/[,，、]/).map(s => s.trim()).filter(Boolean);
    return finish('wins', cur, r, '已記下成果');
  }

  return { bu, project, task, followup, routine, indicator, indicatorValue, win };
})();

  const QUAD = {
    do: { label: '立刻做', hint: '重要又緊急' },
    plan: { label: '排時間做', hint: '重要、還不急' },
    quick: { label: '快速處理或交辦', hint: '緊急、不那麼重要' },
    later: { label: '之後再說', hint: '不急也不重要' }
  };
  const LIGHT = { ok: '達標', warn: '注意', bad: '偏離', none: '未設定' };

  function unitTag(buId) {
    const b = S.bu(buId);
    if (!b) return '';
    return `<span class="unit-tag"><span class="dot" style="background:${esc(b.color)}"></span>${esc(b.name)}</span>`;
  }

  function dueLabel(d, done) {
    if (!d) return '<span class="date">無期限</span>';
    const n = daysBetween(today(), d);
    const txt = n === 0 ? '今天' : n === 1 ? '明天' : n === -1 ? '昨天' : n < 0 ? Math.abs(n) + ' 天前' : fmtDate(d).slice(5);
    return `<span class="date ${!done && n < 0 ? 'over' : ''}">${txt}</span>`;
  }

  function taskRow(t, opts) {
    const o = opts || {};
    const done = t.status === 'done';
    return `<li>
      <input type="checkbox" class="check" data-act="task-toggle" data-id="${esc(t.id)}" ${done ? 'checked' : ''} aria-label="完成 ${esc(t.title)}">
      ${dueLabel(t.due, done)}
      <span class="grow ${done ? 'done-text' : ''}">${esc(t.title)}
        <span class="row-meta">${o.hideUnit ? '' : unitTag(t.buId)}${t.importance === 'H' ? '<span class="pill H">重要</span>' : ''}${t.status === 'doing' ? '<span class="pill tag">進行中</span>' : ''}${o.showScore ? `<span class="small muted mono">分數 ${S.taskScore(t)}</span>` : ''}</span></span>
      <span class="row-actions"><button class="btn sm ghost" data-act="task-edit" data-id="${esc(t.id)}">${t.triaged === false ? '整理' : '編輯'}</button></span></li>`;
  }

  function followRow(f, opts) {
    const o = opts || {};
    const waitedDays = daysBetween(f.askedOn || today(), today());
    const due = f.status === 'waiting' && f.nudgeOn && f.nudgeOn <= today();
    return `<li>
      <span class="date ${due ? 'over' : ''}">${f.status === 'done' ? '已收到' : due ? '該追了' : '追 ' + fmtDate(f.nudgeOn).slice(5)}</span>
      <span class="grow ${f.status === 'done' ? 'done-text' : ''}">${esc(f.what)}
        <span class="row-meta"><span class="small muted">${esc(f.who)}${f.channel ? '・' + esc(f.channel) : ''}・已等 ${waitedDays} 天</span>${o.hideUnit ? '' : unitTag(f.buId)}</span></span>
      <span class="row-actions">${f.status === 'waiting' ? `<button class="btn sm" data-act="fu-done" data-id="${esc(f.id)}">收到了</button>
      <button class="btn sm ghost" data-act="fu-snooze" data-id="${esc(f.id)}" title="提醒日往後延 3 天">+3 天</button>` : ''}
      <button class="btn sm ghost" data-act="fu-edit" data-id="${esc(f.id)}">編輯</button></span></li>`;
  }

  function routineRow(r, opts) {
    const o = opts || {};
    const next = S.routineNext(r);
    const due = next <= today();
    const cad = { weekly: '每週', monthly: '每月', quarterly: '每季' }[r.cadence] || '';
    return `<li>
      <span class="date ${due ? 'over' : ''}">${due ? '該做了' : fmtDate(next).slice(5)}</span>
      <span class="grow">${esc(r.title)}<span class="row-meta"><span class="small muted">${cad}${r.lastDone ? '・上次 ' + fmtDate(r.lastDone).slice(5) : '・還沒做過'}</span>${o.hideUnit ? '' : unitTag(r.buId)}</span></span>
      <span class="row-actions"><button class="btn sm ${due ? 'primary' : ''}" data-act="rt-done" data-id="${esc(r.id)}">完成這次</button>
      <button class="btn sm ghost" data-act="rt-edit" data-id="${esc(r.id)}">編輯</button></span></li>`;
  }

  function sparkline(i) {
    const vs = (i.values || []).slice().sort((a, b) => String(a.period).localeCompare(String(b.period))).slice(-12);
    if (vs.length < 2) return '<div class="spark-empty small muted">記錄兩次以上會出現趨勢</div>';
    const nums = vs.map(v => Number(v.value));
    const tgt = i.target == null || i.target === '' ? null : Number(i.target);
    const all = tgt == null ? nums : nums.concat([tgt]);
    const min = Math.min.apply(null, all), max = Math.max.apply(null, all);
    const span = max - min || 1;
    const W = 160, H = 40, P = 4;
    const x = k => P + k * (W - 2 * P) / (vs.length - 1);
    const y = v => H - P - (v - min) / span * (H - 2 * P);
    const pts = nums.map((v, k) => x(k).toFixed(1) + ',' + y(v).toFixed(1)).join(' ');
    const last = nums[nums.length - 1];
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="最近 ${vs.length} 次紀錄的趨勢">
      ${tgt != null ? `<line x1="${P}" x2="${W - P}" y1="${y(tgt).toFixed(1)}" y2="${y(tgt).toFixed(1)}" class="spark-target"/>` : ''}
      <polyline points="${pts}" class="spark-line" fill="none"/>
      <circle cx="${x(nums.length - 1).toFixed(1)}" cy="${y(last).toFixed(1)}" r="3" class="spark-dot"/></svg>`;
  }

  function indicatorCard(i, opts) {
    const o = opts || {};
    const light = S.indicatorLight(i);
    const last = S.indicatorLatest(i);
    const trend = S.indicatorTrend(i);
    const target = S.data.indicators.find(x => x.id === i.driverOf);
    return `<div class="panel ind-card light-${light}">
      <div class="ind-head">
        <span class="pill ${i.kind === 'lead' ? 'lead' : 'lag'}">${i.kind === 'lead' ? '領先' : '落後'}</span>
        <span class="small muted">${esc(S.BSC[i.perspective] || '')}</span>
        <span class="light-pill ${light}">${LIGHT[light]}</span>
      </div>
      <h3>${esc(i.name)}</h3>
      <div class="ind-value"><b>${last ? esc(last.value) : '—'}</b><span class="muted small">${esc(i.unit || '')}${i.target != null && i.target !== '' ? '・目標 ' + esc(i.target) + esc(i.unit || '') : ''}</span>
        <span class="trend ${trend > 0 ? 'up' : trend < 0 ? 'down' : ''}" aria-label="${trend > 0 ? '變好' : trend < 0 ? '變差' : '持平'}">${trend > 0 ? '▲ 變好' : trend < 0 ? '▼ 變差' : '— 持平'}</span></div>
      ${sparkline(i)}
      <div class="row-meta">${o.hideUnit ? '' : unitTag(i.buId)}${target ? `<span class="small muted">影響 → ${esc(target.name)}</span>` : ''}${last ? `<span class="small muted">更新 ${fmtDate(last.period).slice(5)}</span>` : ''}</div>
      <div class="actions"><button class="btn sm" data-act="ind-record" data-id="${esc(i.id)}">記錄新數值</button><button class="btn sm ghost" data-act="ind-edit" data-id="${esc(i.id)}">編輯</button></div>
    </div>`;
  }

  /* Early warnings: a lead indicator off target, linked to a lag indicator. */
  function warnings(scopeBuId) {
    return S.data.indicators.filter(i => i.kind === 'lead' && (!scopeBuId || i.buId === scopeBuId))
      .map(i => ({ i, light: S.indicatorLight(i), target: S.data.indicators.find(x => x.id === i.driverOf) }))
      .filter(x => x.light === 'warn' || x.light === 'bad');
  }

  async function handle(e) {
    const a = e.target.closest('[data-act]');
    if (!a) return false;
    const id = a.dataset.id;
    const act = a.dataset.act;
    const find = (list) => S.data[list].find(x => x.id === id);
    switch (act) {
      case 'task-toggle': {
        const t = find('tasks'); if (!t) return true;
        t.status = a.checked ? 'done' : 'todo'; t.doneOn = a.checked ? today() : '';
        S.save(); if (a.checked) ui.toast('完成：' + t.title);
        // Update in place so the list does not jump; the item moves to "done" next time the page is opened.
        const row = a.closest('li');
        const text = row && row.querySelector('.grow');
        if (text) text.classList.toggle('done-text', a.checked);
        return true;
      }
      case 'task-edit': await PMO.edit.task(find('tasks')); break;
      case 'fu-done': { const f = find('followups'); if (f) { f.status = 'done'; f.receivedOn = today(); S.save(); ui.toast('已收到：' + f.what); } break; }
      case 'fu-snooze': { const f = find('followups'); if (f) { f.nudgeOn = addDays(today() > f.nudgeOn ? today() : f.nudgeOn, 3); S.save(); ui.toast('改成 ' + fmtDate(f.nudgeOn).slice(5) + ' 再提醒'); } break; }
      case 'fu-edit': await PMO.edit.followup(find('followups')); break;
      case 'rt-done': { const r = find('routines'); if (r) { r.lastDone = today(); S.save(); ui.toast('下次：' + fmtDate(S.routineNext(r)).slice(5)); } break; }
      case 'rt-edit': await PMO.edit.routine(find('routines')); break;
      case 'ind-record': { const i = find('indicators'); if (i) await PMO.edit.indicatorValue(i); break; }
      case 'ind-edit': await PMO.edit.indicator(find('indicators')); break;
      default: return false;
    }
    PMO.app.render();
    return true;
  }

  return { QUAD, LIGHT, unitTag, dueLabel, taskRow, followRow, routineRow, indicatorCard, sparkline, warnings, handle };
})();

  <script>
/* ---- js/services/backup.js ---- */
/* Backup, CSV and ICS export. */
PMO.backup = (function () {
  const { today, addDays, download } = PMO.util;
  const S = PMO.store;

  function exportJSON(includeSettings) {
    const payload = {
      app: 'strategy-pmo',
      exportedAt: new Date().toISOString(),
      data: S.data
    };
    if (includeSettings) {
      // Secrets are stripped on purpose; you re-enter keys on the new device.
      const s = Object.assign({}, S.settings, { claudeKey: '', openaiKey: '', gcalMap: S.settings.gcalMap, connectors: S.settings.connectors.map(c => Object.assign({}, c, { headers: '' })) });
      payload.settings = s;
    }
    download('pmo-backup-' + today() + '.json', JSON.stringify(payload, null, 2), 'application/json');
    S.data.meta.lastBackup = new Date().toISOString();
    S.save();
  }

  function parseBackup(text) {
    const obj = JSON.parse(text);
    const data = obj && obj.data ? obj.data : obj;
    if (!data || !Array.isArray(data.bus) || !Array.isArray(data.projects)) {
      throw new Error('這個檔案不是本工具的備份格式（找不到 bus 與 projects）。');
    }
    return { data, settings: obj.settings || null };
  }

  // Merge keeps existing items and adds/overwrites by id.
  function importData(parsed, mode) {
    if (mode === 'replace') {
      S.replaceAll(parsed.data);
    } else {
      const cur = S.data;
      const inc = S.normalize(parsed.data);
      ['bus', 'projects', 'tasks', 'followups', 'routines', 'indicators', 'wins', 'questions', 'quotes']
        .forEach(k => inc[k].forEach(x => S.upsert(cur[k], x)));
      Object.assign(cur.rituals.days, inc.rituals.days);
      Object.assign(cur.rituals.weeks, inc.rituals.weeks);
      S.save();
    }
    if (parsed.settings) {
      const keep = { claudeKey: S.settings.claudeKey, openaiKey: S.settings.openaiKey };
      Object.assign(S.settings, parsed.settings, keep);
      S.saveSettings();
    }
  }

  function csvCell(v) {
    const s = String(v == null ? '' : v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function toCSV(rows) { return '\ufeff' + rows.map(r => r.map(csvCell).join(',')).join('\r\n'); }

  function exportCSV(kind) {
    const rows = [];
    if (kind === 'projects') {
      rows.push(['事業單位', '專案', '狀態', '階段', '負責人', '開始', '到期', '進度%', '摘要']);
      S.data.projects.forEach(p => {
        const b = S.bu(p.buId);
        rows.push([b ? b.name : '', p.name, S.STATUS[p.status] || p.status, p.stage, p.owner, p.start, p.due, S.progress(p), p.summary]);
      });
    } else if (kind === 'milestones') {
      rows.push(['事業單位', '專案', '里程碑', '日期', '完成']);
      S.allMilestones().forEach(({ m, p, b }) => rows.push([b ? b.name : '', p.name, m.title, m.date, m.done ? '是' : '否']));
    } else if (kind === 'risks') {
      rows.push(['事業單位', '專案', '風險', '等級', '對策', '狀態']);
      S.data.projects.forEach(p => (p.risks || []).forEach(r => {
        const b = S.bu(p.buId);
        rows.push([b ? b.name : '', p.name, r.title, S.LEVEL[r.level] || r.level, r.mitigation, r.status === 'open' ? '未結案' : '已結案']);
      }));
    } else if (kind === 'kpis') {
      rows.push(['事業單位', '專案', '指標', '期間', '目標', '實際', '單位']);
      S.data.projects.forEach(p => (p.kpis || []).forEach(k => {
        const b = S.bu(p.buId);
        rows.push([b ? b.name : '', p.name, k.name, k.period, k.target, k.actual, k.unit]);
      }));
    }
    else if (kind === 'tasks') {
      rows.push(['單位', '任務', '截止日', '重要性', '力氣', '狀態', '優先分數', '完成日', '備註']);
      S.data.tasks.forEach(t => rows.push([S.buName(t.buId), t.title, t.due, S.LEVEL[t.importance] || '', { S: '小', M: '中', L: '大' }[t.effort] || '',
        { todo: '待辦', doing: '進行中', done: '完成' }[t.status] || t.status, S.taskScore(t), t.doneOn || '', t.notes]));
    } else if (kind === 'followups') {
      rows.push(['單位', '等什麼', '跟誰要', '管道', '提出日', '提醒日', '狀態', '收到日']);
      S.data.followups.forEach(f => rows.push([S.buName(f.buId), f.what, f.who, f.channel, f.askedOn, f.nudgeOn, f.status === 'done' ? '已收到' : '等待中', f.receivedOn || '']));
    } else if (kind === 'indicators') {
      rows.push(['單位', '指標', '類型', 'BSC 構面', '方向', '目標', '單位', '日期', '數值']);
      S.data.indicators.forEach(i => {
        const base = [S.buName(i.buId), i.name, i.kind === 'lead' ? '領先' : '落後', S.BSC[i.perspective] || '', i.direction === 'down' ? '越低越好' : '越高越好', i.target, i.unit];
        if (!i.values.length) rows.push(base.concat(['', '']));
        i.values.forEach(v => rows.push(base.concat([v.period, v.value])));
      });
    } else if (kind === 'wins') {
      rows.push(['日期', '單位', '成果', '結果', '能力', '英文']);
      S.data.wins.forEach(w => rows.push([w.date, S.buName(w.buId), w.title, w.impact, (w.tags || []).join('、'), w.english]));
    }
    download('pmo-' + kind + '-' + today() + '.csv', toCSV(rows), 'text/csv;charset=utf-8');
  }

  function icsEscape(s) { return String(s || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;'); }
  function icsDate(d) { return d.replace(/-/g, ''); }

  function buildICS() {
    const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//strategy-pmo//ZH-TW', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:策略 PMO'];
    const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
    S.allMilestones().forEach(({ m, p, b }) => {
      if (!m.date) return;
      lines.push('BEGIN:VEVENT', 'UID:' + m.id + '@strategy-pmo', 'DTSTAMP:' + stamp,
        'DTSTART;VALUE=DATE:' + icsDate(m.date), 'DTEND;VALUE=DATE:' + icsDate(addDays(m.date, 1)),
        'SUMMARY:' + icsEscape('[' + (b ? b.name : '') + '] ' + p.name + '｜' + m.title + (m.done ? '（已完成）' : '')),
        'END:VEVENT');
    });
    lines.push('END:VCALENDAR');
    return lines.join('\r\n');
  }
  function exportICS() { download('pmo-milestones-' + today() + '.ics', buildICS(), 'text/calendar'); }

  function daysSinceBackup() {
    const lb = S.data.meta.lastBackup;
    if (!lb) return null;
    return Math.floor((Date.now() - new Date(lb).getTime()) / 86400000);
  }

  return { exportJSON, parseBackup, importData, exportCSV, exportICS, daysSinceBackup };
})();

  <script>
/* ---- js/services/gcal.js ---- */
/* Google Calendar sync via Google Identity Services (browser OAuth token flow) + Calendar REST API.
   Needs an OAuth Client ID (Web application) whose Authorized JavaScript origin matches where you host this page.
   Scope: calendar.events (read and write events; cannot delete calendars or change sharing). */
PMO.gcal = (function () {
  const S = PMO.store;
  const { addDays, today } = PMO.util;
  const SCOPE = 'https://www.googleapis.com/auth/calendar.events';
  const API = 'https://www.googleapis.com/calendar/v3';
  const TOKEN_KEY = 'pmo.gtoken';
  let token = null;
  let tokenExpiry = 0;
  let gisLoading = null;
  let client = null;
  let clientFor = '';
  let pending = null;

  // Keep the access token for this tab only (about an hour), so a page reload does not ask again.
  try {
    const saved = JSON.parse(sessionStorage.getItem(TOKEN_KEY) || 'null');
    if (saved && saved.exp > Date.now()) { token = saved.t; tokenExpiry = saved.exp; }
  } catch (e) { /* ignore */ }
  function remember() { try { sessionStorage.setItem(TOKEN_KEY, JSON.stringify({ t: token, exp: tokenExpiry })); } catch (e) { /* ignore */ } }

  function loadGIS() {
    if (window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
    if (gisLoading) return gisLoading;
    gisLoading = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://accounts.google.com/gsi/client';
      s.async = true;
      s.onload = () => resolve();
      s.onerror = () => { gisLoading = null; reject(new Error('無法載入 Google 登入元件，請確認網路連線。')); };
      document.head.appendChild(s);
    });
    return gisLoading;
  }

  const ERR = {
    popup_closed: '登入視窗被關掉了，授權沒有完成。如果視窗裡出現錯誤訊息（例如 origin_mismatch），請把畫面截下來對照設定。',
    popup_failed_to_open: '登入視窗被瀏覽器擋住了。請允許這個網站開啟彈出式視窗後再按一次。'
  };

  /* Load Google's script and prepare the client ahead of time.
     Phones only allow a popup when it opens right inside the tap, so nothing slow may run between the tap and the popup. */
  function prepare() {
    const clientId = S.settings.googleClientId;
    if (!clientId || location.protocol === 'file:') return Promise.resolve(false);
    return loadGIS().then(() => {
      if (client && clientFor === clientId) return true;
      client = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: SCOPE,
        callback: resp => {
          const p = pending; pending = null;
          if (!p) return;
          if (resp.error) { p.reject(new Error('Google 授權失敗：' + resp.error)); return; }
          token = resp.access_token;
          tokenExpiry = Date.now() + (Number(resp.expires_in || 3600) - 60) * 1000;
          remember();
          p.resolve();
        },
        error_callback: err => {
          const p = pending; pending = null;
          if (!p) return;
          const type = err && err.type ? err.type : 'unknown';
          p.reject(new Error(ERR[type] || 'Google 授權沒有完成（' + type + '）。'));
        }
      });
      clientFor = clientId;
      return true;
    });
  }

  function ready() { return !!client && clientFor === S.settings.googleClientId; }
  function connected() { return !!token && Date.now() < tokenExpiry; }

  /* Must be called directly from a tap/click handler, with no await before it. */
  function signIn() {
    if (!S.settings.googleClientId) return Promise.reject(new Error('請先到「設定」填入 Google OAuth Client ID。'));
    if (location.protocol === 'file:') return Promise.reject(new Error('Google 登入需要用網址開啟（GitHub Pages 或本機伺服器），不能直接雙擊檔案。'));
    if (!ready()) { prepare(); return Promise.reject(new Error('Google 登入元件還在載入，請過兩秒再按一次「連接 Google」。')); }
    return new Promise((resolve, reject) => {
      pending = { resolve, reject };
      client.requestAccessToken({ prompt: token ? '' : 'consent' });
    });
  }

  function signOut() {
    if (token && window.google && google.accounts) google.accounts.oauth2.revoke(token, () => {});
    token = null; tokenExpiry = 0;
    try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) { /* ignore */ }
  }

  async function call(method, path, body) {
    if (!connected()) {
      const e = new Error('需要先按「連接 Google」授權（授權大約一小時後會過期）。');
      e.status = 401;
      throw e;
    }
    const res = await fetch(API + path, {
      method,
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined
    });
    if (res.status === 204) return null;
    const json = await res.json().catch(() => ({}));
    if (!res.ok) {
      if (res.status === 401) { token = null; tokenExpiry = 0; }
      const err = new Error(res.status === 401 ? '授權過期了，請再按一次「連接 Google」。' : (json.error && json.error.message) || ('Google API 錯誤 ' + res.status));
      err.status = res.status;
      throw err;
    }
    return json;
  }

  function calId() { return encodeURIComponent(S.settings.gcalCalendarId || 'primary'); }

  /* Everything that can go on the calendar, as all-day items: milestones, tasks with a due date, follow-ups to chase. */
  function items(includeDone) {
    const inc = S.settings.gcalInclude || {};
    const out = [];
    if (inc.milestones !== false) S.allMilestones().forEach(({ m, p, b }) => {
      if (!m.date || (m.done && !includeDone)) return;
      out.push({ id: m.id, date: m.date, done: m.done,
        summary: '[' + (b ? b.name : 'PMO') + '] ' + p.name + '｜' + m.title, description: p.summary || '' });
    });
    if (inc.tasks !== false) S.data.tasks.forEach(t => {
      if (!t.due || t.triaged === false || (t.status === 'done' && !includeDone)) return;
      out.push({ id: t.id, date: t.due, done: t.status === 'done',
        summary: '[任務' + (t.buId ? '・' + S.buName(t.buId) : '') + '] ' + t.title, description: t.notes || '' });
    });
    if (inc.followups !== false) S.data.followups.forEach(f => {
      if (!f.nudgeOn || (f.status === 'done' && !includeDone)) return;
      out.push({ id: f.id, date: f.nudgeOn, done: f.status === 'done',
        summary: '[追回覆] ' + f.what + '（' + f.who + '）', description: f.notes || '' });
    });
    return out;
  }

  function eventFor(item) {
    return {
      summary: item.summary + (item.done ? ' ✓' : ''),
      description: (item.description ? item.description + '\n\n' : '') + '由策略 PMO 工作台同步。',
      start: { date: item.date },
      end: { date: addDays(item.date, 1) },
      colorId: item.done ? '8' : undefined,
      extendedProperties: { private: { pmoId: item.id } }
    };
  }

  /* Pushes items to the chosen calendar. Updates existing events, recreates any that were deleted on the calendar side. */
  async function sync(options) {
    const opts = Object.assign({ includeDone: false }, options || {});
    const map = S.settings.gcalMap || (S.settings.gcalMap = {});
    const list = items(opts.includeDone);
    let created = 0, updated = 0, failed = 0, firstError = '';
    for (const item of list) {
      const body = eventFor(item);
      const existing = map[item.id];
      try {
        if (existing) {
          try {
            await call('PATCH', '/calendars/' + calId() + '/events/' + encodeURIComponent(existing), body);
            updated++;
            continue;
          } catch (e) {
            if (e.status !== 404 && e.status !== 410) throw e;
          }
        }
        const ev = await call('POST', '/calendars/' + calId() + '/events', body);
        map[item.id] = ev.id;
        created++;
      } catch (e) {
        console.error(e);
        failed++;
        if (!firstError) firstError = e.message;
        if (e.status === 401 || e.status === 403) { S.saveSettings(); throw e; }
      }
    }
    S.saveSettings();
    return { created, updated, failed, total: list.length, firstError };
  }

  /* Deletes every event this tool created (the ones it remembers), e.g. after sample data was synced by mistake. */
  async function removeAll() {
    const map = S.settings.gcalMap || {};
    let removed = 0, failed = 0;
    for (const key of Object.keys(map)) {
      try {
        await call('DELETE', '/calendars/' + calId() + '/events/' + encodeURIComponent(map[key]));
        removed++; delete map[key];
      } catch (e) {
        if (e.status === 404 || e.status === 410) { delete map[key]; removed++; continue; }
        failed++;
        if (e.status === 401 || e.status === 403) { S.saveSettings(); throw e; }
      }
    }
    S.saveSettings();
    return { removed, failed };
  }

  function toEvent(e) {
    const allDay = !!(e.start && e.start.date);
    const raw = (e.start && (e.start.dateTime || e.start.date)) || '';
    let date = raw.slice(0, 10), time = '';
    if (!allDay && raw) {
      const d = new Date(raw);
      date = d.getFullYear() + '-' + PMO.util.pad(d.getMonth() + 1) + '-' + PMO.util.pad(d.getDate());
      time = PMO.util.pad(d.getHours()) + ':' + PMO.util.pad(d.getMinutes());
    }
    return {
      id: e.id, title: e.summary || '（無標題）', start: raw, date, time, allDay,
      end: allDay && e.end ? e.end.date : '', description: e.description || '',
      fromPmo: !!(e.extendedProperties && e.extendedProperties.private && e.extendedProperties.private.pmoId),
      link: e.htmlLink
    };
  }

  /* Events between two local dates (inclusive), from the chosen calendar or another one you can read (e.g. a public holiday calendar). */
  async function range(fromDate, toDate, calendarId) {
    const start = new Date(fromDate + 'T00:00:00');
    const end = new Date(toDate + 'T23:59:59');
    const out = [];
    let pageToken = '';
    for (let i = 0; i < 5; i++) {
      const q = '?singleEvents=true&orderBy=startTime&maxResults=250&timeMin=' + encodeURIComponent(start.toISOString()) +
        '&timeMax=' + encodeURIComponent(end.toISOString()) + (pageToken ? '&pageToken=' + encodeURIComponent(pageToken) : '');
      const res = await call('GET', '/calendars/' + (calendarId ? encodeURIComponent(calendarId) : calId()) + '/events' + q);
      (res.items || []).forEach(e => { if (e.status !== 'cancelled') out.push(toEvent(e)); });
      if (!res.nextPageToken) break;
      pageToken = res.nextPageToken;
    }
    return out;
  }

  async function upcoming(days) { return range(today(), addDays(today(), days || 14)); }

  return { prepare, ready, signIn, signOut, connected, sync, removeAll, items, upcoming, range };
})();

/* ---- js/services/holidays.js ---- */
/* Public holidays from Google's holiday calendars, one country at a time.
   Reading them needs the Google connection once; each country's year is then kept in this browser for 30 days,
   so the list still shows after the hour-long Google sign-in expires. */
PMO.holidays = (function () {
  const S = PMO.store;
  const { addDays } = PMO.util;
  const CACHE_KEY = 'pmo.holidays';
  const KEEP_DAYS = 30;
  const OFF = /國定假日|公眾假期|法定假日|public holiday/i;
  const loading = {};
  const failed = {};

  function readCache() { try { return JSON.parse(localStorage.getItem(CACHE_KEY) || '{}'); } catch (e) { return {}; } }
  function writeCache(c) { try { localStorage.setItem(CACHE_KEY, JSON.stringify(c)); } catch (e) { /* storage full or blocked: just skip */ } }

  function calendarId(region) { return 'zh-tw.' + region + '#holiday@group.v.calendar.google.com'; }
  function regions() { return PMO.holidaysData; }
  function nameOf(region) { const r = PMO.holidaysData.find(x => x[0] === region); return r ? r[1] : region; }

  function current() { return S.settings.holidayRegion || ''; }
  function setCurrent(region) { S.settings.holidayRegion = region; S.saveSettings(); }
  function pins() { return (S.settings.holidayPins || []).filter(r => PMO.holidaysData.some(x => x[0] === r)); }
  function togglePin(region) {
    const list = pins();
    S.settings.holidayPins = list.includes(region) ? list.filter(r => r !== region) : list.concat(region).slice(-8);
    S.saveSettings();
  }

  /* Cached list for one country and year, or null when it has not been read yet. */
  function cached(region, year) {
    const hit = readCache()[region + '|' + year];
    return hit ? hit.items : null;
  }
  function fresh(region, year) {
    const hit = readCache()[region + '|' + year];
    return hit && Date.now() - hit.at < KEEP_DAYS * 864e5;
  }

  function toItems(events) {
    const out = [];
    events.forEach(e => {
      if (!e.date) return;
      const off = OFF.test(e.description || '');
      // A holiday that spans several days arrives as one event; list each day.
      let d = e.date;
      const last = e.end ? addDays(e.end, -1) : d;
      for (let i = 0; d <= last && i < 14; i++, d = addDays(d, 1)) out.push({ date: d, title: e.title, off });
    });
    return out.sort((a, b) => a.date.localeCompare(b.date));
  }

  /* Reads one country's year from Google if needed. Calls done() when something changed. */
  function ensure(region, year, done) {
    const key = region + '|' + year;
    if (!region || fresh(region, year) || loading[key] || failed[key] || !PMO.gcal.connected()) return;
    loading[key] = true;
    PMO.gcal.range(year + '-01-01', year + '-12-31', calendarId(region))
      .then(evs => {
        const c = readCache();
        c[key] = { at: Date.now(), items: toItems(evs) };
        writeCache(c);
      })
      .catch(err => {
        failed[key] = err.status === 404 ? 'Google 沒有提供這個地區的假期日曆。' : err.message;
      })
      .finally(() => { delete loading[key]; if (done) done(); });
  }

  function isLoading(region, year) { return !!loading[region + '|' + year]; }
  function error(region, year) { return failed[region + '|' + year] || ''; }
  function retry(region, year) {
    delete failed[region + '|' + year];
    const c = readCache(); delete c[region + '|' + year]; writeCache(c);
  }

  function on(region, date) {
    const list = cached(region, date.slice(0, 4)) || [];
    return list.filter(h => h.date === date);
  }

  return { regions, nameOf, current, setCurrent, pins, togglePin, cached, ensure, isLoading, error, retry, on };
})();

  ].join('\n');

  function providerLabel() {
    const s = S.settings;
    if (s.aiProvider === 'claude') return 'Claude（' + (s.claudeModel || '') + '）';
    return (s.openaiModel || 'OpenAI 相容') + '・' + (safeHost(s.openaiUrl) || '未設定網址');

  function ready() {

  function snapshot(scope) {

    const units = scope === 'all' ? S.activeBus() : [S.bu(scope)].filter(Boolean);
    units.forEach(b => {
      lines.push('\n## ' + b.name + '（' + (S.UNIT_TYPE[b.type] || '') + '）' + (b.notes ? '：' + b.notes : ''));
      d.projects.filter(p => p.buId === b.id && p.status !== 'done').forEach(p => {
        lines.push('- 專案：' + p.name + '｜' + (S.STATUS[p.status] || p.status) + '｜階段：' + (p.stage || '—') + '｜到期：' + (p.due || '—') + '｜進度 ' + S.progress(p) + '%');
        p.milestones.filter(m => !m.done).slice(0, 4).forEach(m => lines.push('  未完成里程碑：' + m.date + ' ' + m.title));
        p.risks.filter(r => r.status === 'open').forEach(r => lines.push('  風險（' + (S.LEVEL[r.level] || r.level) + '）：' + r.title));

    const tasks = d.tasks.filter(t => t.status !== 'done' && inScope(t)).sort((a, b) => S.taskScore(b) - S.taskScore(a)).slice(0, 15);

    const inds = d.indicators.filter(inScope);

    if (parked.length) { lines.push('\n## 待問主管'); parked.forEach(q => lines.push('- ' + q.text)); }
    return lines.join('\n');
  }

  function systemPrompt(context) {
    let system = BASE_SYSTEM;
    if (S.settings.aiSystemNote) system += '\n\n使用者補充：' + S.settings.aiSystemNote;
    if (context) system += '\n\n以下是她工作台裡目前的資料（僅供參考）：\n' + context;
    return system;
  }

  async function askClaude(messages, system) {
    const s = S.settings;

    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': s.claudeKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({ model: s.claudeModel || 'claude-sonnet-5-5', max_tokens: 1500, system, messages })
    });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error('Claude API 錯誤：' + ((json.error && json.error.message) || 'HTTP ' + res.status));
    return (json.content || []).filter(c => c.type === 'text').map(c => c.text).join('\n').trim();
  }

  async function askOpenAI(messages, system) {
    const s = S.settings;
    if (!s.openaiUrl) throw new Error('請先到「設定」填入 AI 服務的端點網址。');
    const headers = { 'Content-Type': 'application/json' };
    if (s.openaiAuth === 'bearer') headers.Authorization = 'Bearer ' + s.openaiKey;
    if (s.openaiAuth === 'api-key') headers['api-key'] = s.openaiKey;
    const body = { messages: [{ role: 'system', content: system }].concat(messages), max_tokens: 1500 };
    if (s.openaiModel) body.model = s.openaiModel;
    let res;
    try {
      res = await fetch(s.openaiUrl, { method: 'POST', headers, body: JSON.stringify(body) });
    } catch (e) {
      throw new Error('連不到 AI 服務。常見原因：網址錯誤、服務不允許從瀏覽器呼叫（CORS），或需要公司內網。');
    }
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error('AI 服務錯誤：' + ((json.error && (json.error.message || json.error)) || 'HTTP ' + res.status));
    const choice = json.choices && json.choices[0];
    const content = choice && choice.message && choice.message.content;
    if (Array.isArray(content)) return content.map(c => c.text || '').join('\n').trim();
    return String(content || '').trim();
  }

  async function ask(messages, opts) {
    const system = systemPrompt(opts && opts.context);
    const msgs = messages.map(m => ({ role: m.role, content: m.content }));
    return S.settings.aiProvider === 'claude' ? askClaude(msgs, system) : askOpenAI(msgs, system);
  }

  return { ask, snapshot, PRESETS, providerLabel, ready };
})();
