/* ---- js/services/connectors.js ---- */
/* Generic API connectors: save an endpoint, call it, preview the JSON, or push a backup to a webhook.
   Calls go straight from the browser, so the target API must allow CORS from your page's origin. */
PMO.connectors = (function () {
  const S = PMO.store;

  function list() { return S.settings.connectors || (S.settings.connectors = []); }

  function parseHeaders(text) {
    if (!text || !text.trim()) return {};
    try {
      const h = JSON.parse(text);
      if (typeof h !== 'object' || Array.isArray(h)) throw new Error();
      return h;
    } catch (e) {
      throw new Error('Headers 要是 JSON 物件，例如 {"Authorization": "Bearer xxx"}');
    }
  }

  async function run(c, overrideBody) {
    const headers = parseHeaders(c.headers);
    const init = { method: c.method || 'GET', headers };
    const body = overrideBody !== undefined ? overrideBody : c.body;
    if (init.method !== 'GET' && init.method !== 'HEAD' && body) {
      init.body = typeof body === 'string' ? body : JSON.stringify(body);
      if (!Object.keys(headers).some(k => k.toLowerCase() === 'content-type')) headers['Content-Type'] = 'application/json';
    }
    const started = performance.now();
    let res;
    try {
      res = await fetch(c.url, init);
    } catch (e) {
      throw new Error('連不到這個網址。常見原因：對方沒有開放 CORS、網址錯誤，或需要公司內網。');
    }
    const ms = Math.round(performance.now() - started);
    const text = await res.text();
    let parsed = null;
    try { parsed = JSON.parse(text); } catch (_) { parsed = null; }
    return { ok: res.ok, status: res.status, ms, text, json: parsed };
  }

  async function pushBackup(c) {
    const payload = { app: 'strategy-pmo', exportedAt: new Date().toISOString(), data: S.data };
    return run(Object.assign({}, c, { method: c.method === 'GET' ? 'POST' : c.method }), JSON.stringify(payload));
  }

  return { list, run, pushBackup };
})();

/* ---- js/services/notify.js ---- */
/* Browser reminders while the page is open: tasks due today or overdue, follow-ups to chase, routines due.
   Each item notifies at most once per day. Nothing runs when the tab is closed. */
PMO.notify = (function () {
  const S = PMO.store;
  const { today } = PMO.util;
  const SEEN_KEY = 'pmo.notified';
  let timer = null;

  function supported() { return 'Notification' in window; }
  function permission() { return supported() ? Notification.permission : 'unsupported'; }

  async function enable() {
    if (!supported()) throw new Error('這個瀏覽器不支援通知。');
    const p = await Notification.requestPermission();
    if (p !== 'granted') throw new Error('瀏覽器沒有允許通知，可以在網址列左邊的網站設定裡開啟。');
    S.settings.notify = true; S.saveSettings();
    start(); check();
  }
  function disable() { S.settings.notify = false; S.saveSettings(); stop(); }

  function seen() {
    try { const s = JSON.parse(localStorage.getItem(SEEN_KEY) || '{}'); return s.day === today() ? s : { day: today(), ids: [] }; }
    catch (e) { return { day: today(), ids: [] }; }
  }
  function markSeen(s) { try { localStorage.setItem(SEEN_KEY, JSON.stringify(s)); } catch (e) { /* ignore */ } }

  function dueItems() {
    const t = today();
    const d = S.data;
    const out = [];
    d.tasks.filter(x => x.status !== 'done' && x.triaged !== false && x.due && x.due <= t)
      .forEach(x => out.push({ id: 't:' + x.id, title: x.due < t ? '逾期任務' : '今天到期', body: x.title, hash: '#/tasks' }));
    d.followups.filter(f => f.status === 'waiting' && f.nudgeOn && f.nudgeOn <= t)
      .forEach(f => out.push({ id: 'f:' + f.id, title: '該追回覆了', body: f.what + '（' + f.who + '）', hash: '#/followups' }));
    d.routines.filter(r => S.routineNext(r) <= t)
      .forEach(r => out.push({ id: 'r:' + r.id, title: '例行事項', body: r.title, hash: '#/routines' }));
    return out;
  }

  function check() {
    if (!S.settings.notify || permission() !== 'granted') return;
    const s = seen();
    const fresh = dueItems().filter(i => !s.ids.includes(i.id));
    if (!fresh.length) return;
    if (fresh.length > 3) {
      show({ title: '策略 PMO：今天有 ' + fresh.length + ' 件事要處理', body: fresh.slice(0, 3).map(i => i.body).join('、') + '…', hash: '#/today' });
    } else fresh.forEach(show);
    s.ids = s.ids.concat(fresh.map(i => i.id));
    markSeen(s);
  }

  function show(i) {
    try {
      const n = new Notification(i.title, { body: i.body, tag: i.id || 'pmo-summary' });
      n.onclick = () => { window.focus(); location.hash = i.hash; n.close(); };
    } catch (e) { /* some browsers only allow notifications from a service worker */ }
  }

  function start() {
    stop();
    if (!S.settings.notify) return;
    setTimeout(check, 1500);
    timer = setInterval(check, 5 * 60 * 1000);
  }
  function stop() { if (timer) clearInterval(timer); timer = null; }

  return { supported, permission, enable, disable, start, check, dueItems };
})();

    const dueNow = open.filter(x => x.due && x.due <= t && !topIds.includes(x.id)).sort((a, b) => a.due.localeCompare(b.due));
    const inbox = d.tasks.filter(x => x.triaged === false && x.status !== 'done');

        <section class="panel">
          <div class="panel-head"><h2>該追的回覆</h2><a class="small" href="#/followups">全部 →</a></div>
          ${chase.length ? `<ul class="list">${chase.map(f => P.followRow(f)).join('')}</ul>` : '<p class="empty">沒有需要今天追的。</p>'}
        </section>
      </div>

      ${dueNow.length || ms.length ? `<section class="panel">
        <div class="panel-head"><h2>到期與逾期</h2></div>
        <ul class="list">${dueNow.map(x => P.taskRow(x)).join('')}
        ${ms.map(x => `<li><span class="date ${x.m.date < t ? 'over' : ''}">${fmtDate(x.m.date).slice(5)}</span>
          <span class="grow">${esc(x.m.title)}<span class="row-meta"><span class="pill tag">里程碑</span><a class="small" href="#/project/${esc(x.p.id)}">${esc(x.p.name)}</a></span></span></li>`).join('')}</ul>

  function capture(text, kind, buId) {
    const t = today();
    if (kind === 'task') S.data.tasks.push({ id: uid('t'), title: text, buId, due: t, importance: 'M', effort: 'M', status: 'todo', triaged: true, notes: '', created: t });
    if (kind === 'idea') S.data.tasks.push({ id: uid('t'), title: text, buId, due: '', importance: '', effort: '', status: 'todo', triaged: false, notes: '', created: t });
    if (kind === 'follow') S.data.followups.push({ id: uid('f'), what: text, who: '（待補）', buId, channel: '', askedOn: t, nudgeOn: addDays(t, 3), status: 'waiting', notes: '' });
    if (kind === 'question') S.data.questions.push({ id: uid('q'), text, buId, status: 'parked', created: t, answer: '' });

      if (a) { S.data.meta.isSample = false; S.save(); PMO.app.render(); }

  return { render, mount };
})();

        <div class="actions"><button class="btn primary" data-act="new">＋ 新增指標</button></div></div>

        <span class="grow">領先指標「${esc(w.i.name)}」${w.light === 'bad' ? '已偏離目標' : '接近門檻'}${w.target ? `，可能會影響「${esc(w.target.name)}」` : '。可以在編輯時設定它會影響哪個落後指標。'}</span></li>`).join('')}</ul></section>` : ''}
      <div class="toolbar">

  <script>
/* ---- js/views/bu.js ---- */
/* Unit page: everything for one unit in one place, plus a weekly report draft. */
PMO.views = PMO.views || {};

PMO.views.bu = (function () {
  const S = PMO.store;
  const P = PMO.parts;
  const { esc, fmtDate, today, addDays, copy } = PMO.util;
  const ui = PMO.ui;
  let reportOpen = false;

  function weeklyReport(b) {
    const t = today();
    const from = addDays(t, -6);
    const lines = [b.name + ' 週報（' + fmtDate(from) + '–' + fmtDate(t) + '）', ''];
    const doneTasks = S.data.tasks.filter(x => x.buId === b.id && x.status === 'done' && x.doneOn >= from);
    const ps = S.projectsOf(b.id).filter(p => p.status !== 'done');
    lines.push('一、本週完成');
    const doneMs = [];
    ps.forEach(p => p.milestones.filter(m => m.done && m.date >= from && m.date <= t).forEach(m => doneMs.push(p.name + '：' + m.title)));
    const doneItems = doneMs.concat(doneTasks.map(x => x.title));
    lines.push(doneItems.length ? doneItems.map(x => '・' + x).join('\n') : '・（本週沒有記錄）');
    lines.push('', '二、專案進度');
    if (!ps.length) lines.push('・目前沒有進行中的專案');
    ps.forEach(p => {
      lines.push('・' + p.name + '｜' + (S.STATUS[p.status] || p.status) + '｜進度 ' + S.progress(p) + '%');
      const next = p.milestones.filter(m => !m.done && m.date <= addDays(t, 14)).sort((a, c) => a.date.localeCompare(c.date));
      if (next.length) lines.push('  接下來兩週：' + next.map(m => fmtDate(m.date).slice(5) + ' ' + m.title + (m.date < t ? '（已逾期）' : '')).join('、'));
      const risks = p.risks.filter(r => r.status === 'open' && r.level !== 'L');
      if (risks.length) lines.push('  需要注意：' + risks.map(r => r.title + (r.mitigation ? '（對策：' + r.mitigation + '）' : '')).join('；'));
    });
    const inds = S.data.indicators.filter(i => i.buId === b.id);
    if (inds.length) {
      lines.push('', '三、指標');
      inds.forEach(i => { const l = S.indicatorLatest(i); lines.push('・' + i.name + '：' + (l ? l.value + (i.unit || '') : '—') + (i.target != null && i.target !== '' ? ' / 目標 ' + i.target + (i.unit || '') : '') + '（' + P.LIGHT[S.indicatorLight(i)] + '）'); });
    }
    const waiting = S.data.followups.filter(f => f.buId === b.id && f.status === 'waiting');
    if (waiting.length) { lines.push('', '四、等待中的資料'); waiting.forEach(f => lines.push('・' + f.what + '（' + f.who + '）')); }
    const qs = S.data.questions.filter(q => q.buId === b.id && q.status === 'parked');
    if (qs.length) { lines.push('', '想跟主管確認：'); qs.forEach(q => lines.push('・' + q.text)); }
    return lines.join('\n');
  }

  function render(params) {
    const b = S.bu(params.id);
    if (!b) return { title: '找不到單位', html: '<p class="empty">這個單位不存在，可能已被刪除。<a href="#/today">回今天</a></p>' };
    const t = today();
    const ps = S.projectsOf(b.id);
    const tasks = S.data.tasks.filter(x => x.buId === b.id && x.status !== 'done').sort((a, c) => S.taskScore(c) - S.taskScore(a));
    const fus = S.data.followups.filter(f => f.buId === b.id && f.status === 'waiting');
    const rts = S.data.routines.filter(r => r.buId === b.id);
    const inds = S.data.indicators.filter(i => i.buId === b.id);
    const qs = S.data.questions.filter(q => q.buId === b.id && q.status === 'parked');

    const rows = ps.map(p => {
      const over = p.due && p.due < t && p.status !== 'done';
      const next = p.milestones.filter(m => !m.done).sort((a, c) => a.date.localeCompare(c.date))[0];
      return `<a class="proj-row" href="#/project/${esc(p.id)}">
        <span class="proj-name">${esc(p.name)}</span>${ui.statusPill(p.status)}
        <div class="progress" aria-label="進度 ${S.progress(p)}%"><i style="width:${S.progress(p)}%"></i></div>
        <div class="proj-meta"><span>階段：${esc(p.stage || '—')}</span><span class="${over ? 'date over' : ''}">到期 ${fmtDate(p.due)}</span>
        ${next ? `<span>下一步：${esc(next.title)}（${fmtDate(next.date).slice(5)}）</span>` : ''}
        ${p.risks.some(r => r.status === 'open' && r.level === 'H') ? '<span class="pill H">有高風險</span>' : ''}</div></a>`;
    }).join('');

    const html = `
      <div class="page-head">
        <div><h1><span class="dot big" style="background:${esc(b.color)}"></span>${esc(b.name)}</h1>
        <p>${esc(S.UNIT_TYPE[b.type] || '')}${b.archived ? '・已停用' : ''}${b.owner ? '・主管：' + esc(b.owner) : ''}${b.counterpart ? '・對口：' + esc(b.counterpart) : ''}</p></div>
        <div class="actions">
          <button class="btn" data-act="report">${reportOpen ? '收起週報' : '產生週報'}</button>
          <button class="btn" data-act="edit-bu">編輯單位</button>
          <button class="btn primary" data-act="new-task">＋ 任務</button>
        </div>
      </div>
      ${b.archived ? '<div class="notice"><b>這個單位已停用。</b> 資料都還在，只是不會出現在選單和選項裡。到「編輯單位」取消勾選就能恢復。</div>' : ''}
      ${b.notes ? `<p class="muted" style="margin:0">${esc(b.notes)}</p>` : ''}
      ${reportOpen ? `<section class="panel"><div class="panel-head"><h2>週報草稿</h2><button class="btn sm" data-act="copy-report">複製</button></div>
        <textarea id="report-text" rows="14" aria-label="週報內容">${esc(weeklyReport(b))}</textarea>
        <p class="hint">依目前資料自動整理，貼到信件或訊息前可以再修改。內容只在你的瀏覽器產生。</p></section>` : ''}
      <div class="grid-2">
        <section class="panel"><div class="panel-head"><h2>待辦（${tasks.length}）</h2><button class="btn sm" data-act="new-task">＋</button></div>
          ${tasks.length ? `<ul class="list">${tasks.map(x => P.taskRow(x, { hideUnit: true })).join('')}</ul>` : '<p class="empty">沒有待辦。</p>'}</section>
        <section class="panel"><div class="panel-head"><h2>等待回覆（${fus.length}）</h2><button class="btn sm" data-act="new-fu">＋</button></div>
          ${fus.length ? `<ul class="list">${fus.map(f => P.followRow(f, { hideUnit: true })).join('')}</ul>` : '<p class="empty">沒有在等的。</p>'}</section>
      </div>
      <section class="panel"><div class="panel-head"><h2>專案（${ps.length}）</h2><button class="btn sm" data-act="new-project">＋ 專案</button></div>
        ${rows || '<p class="empty">還沒有專案。</p>'}</section>
      ${inds.length ? `<section><div class="panel-head"><h2>指標</h2><button class="btn sm" data-act="new-ind">＋ 指標</button></div><div class="grid">${inds.map(i => P.indicatorCard(i, { hideUnit: true })).join('')}</div></section>`
        : `<section class="panel"><div class="panel-head"><h2>指標</h2><button class="btn sm" data-act="new-ind">＋ 指標</button></div><p class="empty">還沒有這個單位的指標。</p></section>`}
      <div class="grid-2">
        <section class="panel"><div class="panel-head"><h2>例行事項</h2><button class="btn sm" data-act="new-rt">＋</button></div>
          ${rts.length ? `<ul class="list">${rts.map(r => P.routineRow(r, { hideUnit: true })).join('')}</ul>` : '<p class="empty">沒有。</p>'}</section>
        <section class="panel"><div class="panel-head"><h2>待問主管</h2><a href="#/questions" class="small">全部 →</a></div>
          ${qs.length ? `<ul class="list">${qs.map(q => `<li><span class="grow">${esc(q.text)}</span><span class="date">${fmtDate(q.created).slice(5)}</span></li>`).join('')}</ul>` : '<p class="empty">沒有待問的問題。</p>'}</section>
      </div>`;
    return { title: b.name, html };
  }

  function mount(root, params) {
    const b = S.bu(params.id);
    root.onclick = async e => {
      if (await P.handle(e)) return;
      const a = e.target.closest('[data-act]');
      if (!a || !b) return;
      const act = a.dataset.act;
      if (act === 'edit-bu') { await PMO.edit.bu(b); PMO.app.render(); }
      if (act === 'new-project') { const p = await PMO.edit.project(b.id); if (p) location.hash = '#/project/' + p.id; }
      if (act === 'new-task') { await PMO.edit.task(null, { buId: b.id }); PMO.app.render(); }
      if (act === 'new-fu') { await PMO.edit.followup(null, { buId: b.id }); PMO.app.render(); }
      if (act === 'new-ind') { await PMO.edit.indicator(null, { buId: b.id }); PMO.app.render(); }
      if (act === 'new-rt') { const r = await PMO.edit.routine(null); if (r) { r.buId = r.buId || b.id; S.save(); } PMO.app.render(); }
      if (act === 'report') { reportOpen = !reportOpen; PMO.app.render(); }
      if (act === 'copy-report') { const ok = await copy(document.getElementById('report-text').value); ui.toast(ok ? '已複製週報' : '複製失敗，請手動選取文字'); }
    };
  }

  return { render, mount, weeklyReport };
})();

</script>

/* ---- js/views/project.js ---- */
/* Project detail: milestones, risks, KPIs, meeting log. */
PMO.views.project = (function () {
  const S = PMO.store;
  const { esc, fmtDate, today, uid } = PMO.util;
  const ui = PMO.ui;

  function render(params) {
    const p = S.project(params.id);
    if (!p) return { title: '找不到專案', html: '<p class="empty">這個專案不存在，可能已被刪除。<a href="#/dashboard">回總覽</a></p>' };
    const b = S.bu(p.buId);
    const t = today();
    const ms = p.milestones.slice().sort((a, c) => String(a.date).localeCompare(String(c.date)));

    const msHtml = ms.length ? `<ul class="list">${ms.map(m => `<li>
        <input type="checkbox" class="check" data-act="toggle-ms" data-id="${esc(m.id)}" ${m.done ? 'checked' : ''} aria-label="完成 ${esc(m.title)}">
        <span class="date ${!m.done && m.date < t ? 'over' : ''}">${fmtDate(m.date)}</span>
        <span class="grow ${m.done ? 'done-text' : ''}">${esc(m.title)}</span>
        <button class="btn sm ghost" data-act="edit-ms" data-id="${esc(m.id)}">編輯</button></li>`).join('')}</ul>`
      : '<p class="empty">還沒有里程碑。把專案拆成幾個有日期的節點，日曆同步和週報都會用到。</p>';

    const riskHtml = p.risks.length ? `<ul class="list">${p.risks.map(r => `<li>
        ${ui.levelPill(r.level)}
        <span class="grow ${r.status === 'closed' ? 'done-text' : ''}">${esc(r.title)}${r.mitigation ? `<br><span class="small muted">對策：${esc(r.mitigation)}</span>` : ''}</span>
        <button class="btn sm ghost" data-act="edit-risk" data-id="${esc(r.id)}">編輯</button></li>`).join('')}</ul>`
      : '<p class="empty">沒有登記的風險。</p>';

    const kpiHtml = p.kpis.length ? `<div class="table-wrap"><table><thead><tr><th>指標</th><th>期間</th><th class="num">目標</th><th class="num">實際</th><th class="num">達成</th><th></th></tr></thead><tbody>
      ${p.kpis.map(k => {
        const rate = k.target ? Math.round((Number(k.actual) || 0) / Number(k.target) * 100) : null;
        return `<tr><td>${esc(k.name)}</td><td>${esc(k.period || '')}</td><td class="num">${esc(k.target ?? '—')} ${esc(k.unit || '')}</td>
        <td class="num">${esc(k.actual ?? '—')} ${esc(k.unit || '')}</td><td class="num">${rate == null ? '—' : rate + '%'}</td>
        <td><button class="btn sm ghost" data-act="edit-kpi" data-id="${esc(k.id)}">編輯</button></td></tr>`;
      }).join('')}</tbody></table></div>`
      : '<p class="empty">還沒有 KPI。</p>';

    const logs = p.logs.slice().sort((a, c) => String(c.date).localeCompare(String(a.date)));
    const logHtml = logs.length ? `<ul class="list">${logs.map(l => `<li>
        <span class="date">${fmtDate(l.date)}</span>
        <span class="grow"><b>${esc(l.title)}</b>${l.notes ? `<br><span class="small">${esc(l.notes)}</span>` : ''}${l.actions ? `<br><span class="small muted">待辦：${esc(l.actions)}</span>` : ''}</span>
        <button class="btn sm ghost" data-act="edit-log" data-id="${esc(l.id)}">編輯</button></li>`).join('')}</ul>`
      : '<p class="empty">還沒有紀錄。每次對齊會後記三件事：結論、待辦、下次時間。</p>';

    const html = `
      <div class="page-head">
        <div>
          <div class="small"><a href="#/bu/${esc(p.buId)}">${esc(b ? b.name : '未分類')}</a></div>
          <h1>${esc(p.name)}</h1>
          <p>${ui.statusPill(p.status)} 階段：${esc(p.stage || '—')}｜${fmtDate(p.start)} → ${fmtDate(p.due)}｜負責：${esc(p.owner || '—')}</p>
        </div>
        <div class="actions"><button class="btn" data-act="edit-project">編輯專案</button></div>
      </div>
      ${p.summary ? `<p style="margin:0">${esc(p.summary)}</p>` : ''}
      <div class="progress" style="height:8px"><i style="width:${S.progress(p)}%"></i></div>
      <div class="grid-2">
        <section class="panel"><div class="panel-head"><h2>里程碑</h2><button class="btn sm" data-act="new-ms">＋ 新增</button></div>${msHtml}</section>
        <section class="panel"><div class="panel-head"><h2>風險</h2><button class="btn sm" data-act="new-risk">＋ 新增</button></div>${riskHtml}</section>
      </div>
      <section class="panel"><div class="panel-head"><h2>KPI</h2><button class="btn sm" data-act="new-kpi">＋ 新增</button></div>${kpiHtml}</section>
      <section class="panel"><div class="panel-head"><h2>會議與對齊紀錄</h2><button class="btn sm" data-act="new-log">＋ 新增</button></div>${logHtml}</section>`;
    return { title: p.name, html };
  }

  async function editItem(p, kind, item) {
    const isNew = !item;
    const cur = item || {};
    const defs = {
      ms: { list: 'milestones', title: '里程碑', fields: [
        { name: 'title', label: '內容', value: cur.title, required: true },
        { name: 'date', label: '日期', type: 'date', value: cur.date || today(), row: true },
        { name: 'done', label: '狀態', type: 'checkbox', value: cur.done, checkLabel: '已完成', row: true }] },
      risk: { list: 'risks', title: '風險', fields: [
        { name: 'title', label: '風險描述', value: cur.title, required: true },
        { name: 'level', label: '等級', type: 'select', value: cur.level || 'M', row: true, options: [{ value: 'H', label: '高' }, { value: 'M', label: '中' }, { value: 'L', label: '低' }] },
        { name: 'status', label: '狀態', type: 'select', value: cur.status || 'open', row: true, options: [{ value: 'open', label: '未結案' }, { value: 'closed', label: '已結案' }] },
        { name: 'mitigation', label: '對策', type: 'textarea', value: cur.mitigation }] },
      kpi: { list: 'kpis', title: 'KPI', fields: [
        { name: 'name', label: '指標名稱', value: cur.name, required: true },
        { name: 'period', label: '期間', value: cur.period, placeholder: '例如：2026 Q4', row: true },
        { name: 'unit', label: '單位', value: cur.unit, placeholder: '%、件、萬元', row: true },
        { name: 'target', label: '目標', type: 'number', value: cur.target, row: true },
        { name: 'actual', label: '實際', type: 'number', value: cur.actual, row: true }] },
      log: { list: 'logs', title: '紀錄', fields: [
        { name: 'title', label: '標題', value: cur.title, required: true, placeholder: '例如：與單位企劃對齊' },
        { name: 'date', label: '日期', type: 'date', value: cur.date || today() },
        { name: 'notes', label: '結論', type: 'textarea', value: cur.notes },
        { name: 'actions', label: '待辦與下次時間', type: 'textarea', value: cur.actions }] }
    };
    const d = defs[kind];
    const r = await ui.form({ title: (isNew ? '新增' : '編輯') + d.title, fields: d.fields, allowDelete: !isNew });
    if (!r) return;
    if (r === 'delete') { p[d.list] = p[d.list].filter(x => x.id !== cur.id); }
    else S.upsert(p[d.list], Object.assign({ id: cur.id || uid(kind) }, r));
    S.save();
    PMO.app.render();
  }

  function mount(root, params) {
    const p = S.project(params.id);
    root.onclick = async e => {
      const a = e.target.closest('[data-act]');
      if (!a || !p) return;
      const act = a.dataset.act, id = a.dataset.id;
      if (act === 'toggle-ms') {
        const m = p.milestones.find(x => x.id === id);
        if (m) { m.done = a.checked; S.save(); PMO.app.render(); }
        return;
      }
      if (act === 'edit-project') { await PMO.edit.project(p.buId, p); PMO.app.render(); return; }
      const [verb, kind] = act.split('-');
      const listName = { ms: 'milestones', risk: 'risks', kpi: 'kpis', log: 'logs' }[kind];
      if (!listName) return;
      const item = verb === 'edit' ? p[listName].find(x => x.id === id) : null;
      await editItem(p, kind, item);
    };
  }

  return { render, mount };
})();

</script>

PMO.views = PMO.views || {};

PMO.views.questions = (function () {

  function render() {

    const item = q => {

        <span class="date">${fmtDate(q.created).slice(5)}</span>
        <span class="grow">${esc(q.text)}${q.answer ? `<br><span class="small muted">回覆：${esc(q.answer)}</span>` : ''}

    };
    const section = st => `<section class="panel"><div class="panel-head"><h2>${LABEL[st]}（${group(st).length}）</h2>
      ${st === 'parked' && group(st).length ? '<button class="btn sm" data-act="copy">複製成清單</button>' : ''}</div>
      ${group(st).length ? `<ul class="list">${group(st).map(item).join('')}</ul>` : '<p class="empty">沒有。</p>'}</section>`;

    return {
      title: '問題清單',
      html: `<div class="page-head"><div><h1>問題清單</h1><p>想問主管或事業單位的事，先記下來，整理好、等時機對了再一起問。</p></div>
        <div class="actions"><button class="btn primary" data-act="new">＋ 記一個問題</button></div></div>
        ${section('parked')}${section('asked')}${section('answered')}`
    };
  }

  async function edit(q) {
    const cur = q || {};
    const r = await ui.form({
      title: q ? '編輯問題' : '記一個問題',
      allowDelete: !!q,
      fields: [
        { name: 'text', label: '問題', type: 'textarea', value: cur.text, required: true, placeholder: '例如：新事業的追蹤表，主管希望先看哪三個指標？' },
        { name: 'buId', label: '相關單位', type: 'select', value: cur.buId || '', row: true,
          options: [{ value: '', label: '不分單位' }].concat(S.data.bus.map(b => ({ value: b.id, label: b.name }))) },
        { name: 'status', label: '狀態', type: 'select', value: cur.status || 'parked', row: true,
          options: Object.keys(LABEL).map(k => ({ value: k, label: LABEL[k] })) },
        { name: 'answer', label: '回覆或結論', type: 'textarea', value: cur.answer }
      ]
    });
    if (!r) return;
    if (r === 'delete') S.data.questions = S.data.questions.filter(x => x.id !== cur.id);
    else S.upsert(S.data.questions, Object.assign({ id: cur.id || uid('q'), created: cur.created || today() }, r));
    S.save();
    PMO.app.render();
  }

  function mount(root) {
    root.onclick = async e => {
      const a = e.target.closest('[data-act]');
      if (!a) return;
      if (a.dataset.act === 'new') await edit(null);
      if (a.dataset.act === 'edit') await edit(S.data.questions.find(q => q.id === a.dataset.id));
      if (a.dataset.act === 'copy') {
        const text = S.data.questions.filter(q => q.status === 'parked').map((q, i) => (i + 1) + '. ' + q.text).join('\n');
        const ok = await PMO.util.copy(text);
        ui.toast(ok ? '已複製待問清單' : '複製失敗');
      }
    };
  }

  return { render, mount };
})();

</script>

/* 成果紀錄：what you did, the result, and which competencies it shows. Export to Markdown for reviews and résumés. */
PMO.views = PMO.views || {};

PMO.views.wins = (function () {
  const S = PMO.store;
  const { esc, fmtDate, download, today, copy } = PMO.util;
  const ui = PMO.ui;
  let tag = '';

  function quarter(d) { const m = Number(String(d).slice(5, 7)) || 1; return String(d).slice(0, 4) + ' Q' + Math.ceil(m / 3); }

  function markdown(list) {
    const byQ = {};
    list.forEach(w => { (byQ[quarter(w.date)] = byQ[quarter(w.date)] || []).push(w); });
    return Object.keys(byQ).sort().reverse().map(q => '## ' + q + '\n\n' + byQ[q].map(w =>
      '- **' + w.title + '**' + (w.impact ? '：' + w.impact : '') + (w.tags.length ? '（' + w.tags.join('、') + '）' : '') +
      (w.english ? '\n  - ' + w.english : '')).join('\n')).join('\n\n');
  }

  function render() {
    const all = S.data.wins.slice().sort((a, b) => String(b.date).localeCompare(String(a.date)));
    const list = tag ? all.filter(w => w.tags.includes(tag)) : all;
    const counts = S.COMPETENCIES.map(c => ({ c, n: all.filter(w => w.tags.includes(c)).length }));
    const max = Math.max(1, ...counts.map(x => x.n));
    const html = `
      <div class="page-head"><div><h1>成果紀錄</h1><p>做完一件事就記一筆：做了什麼、帶來什麼結果、用到哪些能力。年度考核、談升遷或寫英文履歷時直接拿來用。</p></div>
        <div class="actions"><button class="btn" data-act="copy" ${list.length ? '' : 'disabled'}>複製成條列</button><button class="btn" data-act="md" ${list.length ? '' : 'disabled'}>下載 Markdown</button><button class="btn primary" data-act="new">＋ 記一筆</button></div></div>
      <section class="panel">
        <div class="panel-head"><h2>能力分布</h2>${tag ? `<button class="btn sm ghost" data-act="tag" data-v="">清除篩選</button>` : ''}</div>
        <div class="bars">${counts.map(x => `<button class="bar-row ${tag === x.c ? 'on' : ''}" data-act="tag" data-v="${esc(x.c)}">
          <span>${esc(x.c)}</span><span class="bar-track"><i style="width:${x.n / max * 100}%"></i></span><span class="mono small">${x.n}</span></button>`).join('')}</div>
        <p class="hint">還沒有紀錄的能力，就是接下來可以找機會累積的方向。點一列可以只看那項能力的成果。</p>
      </section>
      <section class="panel">
        <div class="panel-head"><h2>${tag ? esc(tag) : '全部成果'}（${list.length}）</h2></div>
        ${list.length ? `<ul class="list">${list.map(w => `<li><span class="date">${fmtDate(w.date).slice(5)}</span>
          <span class="grow"><b>${esc(w.title)}</b>${w.impact ? `<br><span class="small">${esc(w.impact)}</span>` : ''}
          ${w.english ? `<br><span class="small muted">${esc(w.english)}</span>` : ''}
          <span class="row-meta">${PMO.parts.unitTag(w.buId)}${w.tags.map(t => `<span class="pill tag">${esc(t)}</span>`).join('')}</span></span>
          <button class="btn sm ghost" data-act="edit" data-id="${esc(w.id)}">編輯</button></li>`).join('')}</ul>`
          : '<p class="empty">還沒有紀錄。今天做完的事裡，挑一件記下來。</p>'}
      </section>`;
    return { title: '成果紀錄', html };
  }

  function mount(root) {
    root.onclick = async e => {
      const a = e.target.closest('[data-act]');
      if (!a) return;
      const act = a.dataset.act;
      const list = () => S.data.wins.slice().sort((x, y) => String(y.date).localeCompare(String(x.date))).filter(w => !tag || w.tags.includes(tag));
      if (act === 'new') { await PMO.edit.win(null); PMO.app.render(); }
      if (act === 'edit') { await PMO.edit.win(S.data.wins.find(w => w.id === a.dataset.id)); PMO.app.render(); }
      if (act === 'tag') { tag = a.dataset.v === tag ? '' : a.dataset.v; PMO.app.render(); }
      if (act === 'md') download('成果紀錄-' + today() + '.md', '# 成果紀錄\n\n' + markdown(list()), 'text/markdown');
      if (act === 'copy') { const ok = await copy(markdown(list())); ui.toast(ok ? '已複製' : '複製失敗'); }
    };
  }

  return { render, mount };
})();

/* ---- js/views/calendar.js ---- */
/* Google Calendar: connect, push milestones, see the next two weeks. */
PMO.views = PMO.views || {};

PMO.views.calendar = (function () {
  const S = PMO.store;
  const { esc, fmtDate } = PMO.util;
  const ui = PMO.ui;
  let events = null;
  let lastResult = null; // { ok, text }
  let removeArmed = false;

  function render() {
    const hasId = !!S.settings.googleClientId;
    const isFile = location.protocol === 'file:';
    const pending = PMO.gcal.items(false);
    const inc = S.settings.gcalInclude;
    const mapped = Object.keys(S.settings.gcalMap || {}).length;

    const evHtml = events == null ? '<p class="empty">連接後可以看到日曆上接下來兩週的行程。</p>'
      : events.length ? `<ul class="list">${events.map(ev => `<li>
          <span class="date">${esc(ev.allDay ? fmtDate(ev.start).slice(5) : ev.start.slice(5, 16).replace('T', ' '))}</span>
          <span class="grow">${esc(ev.title)}</span>${ev.fromPmo ? '<span class="pill tag">PMO</span>' : ''}</li>`).join('')}</ul>`
      : '<p class="empty">接下來兩週沒有行程。</p>';

    const html = `
      <div class="page-head"><div><h1>Google 日曆</h1><p>把里程碑、有截止日的任務和要追的回覆同步成整天的日曆事件。改日期或標完成後再同步一次就會更新。</p></div></div>
      ${isFile ? '<div class="notice"><b>目前是直接開啟檔案。</b> Google 登入需要用網址開啟，請照 README 用 GitHub Pages 或本機伺服器打開。下面的 .ics 匯出不受影響。</div>' : ''}
      ${!hasId ? '<div class="notice"><b>還沒設定 Google Client ID。</b> 到「設定」填入後才能連接，步驟寫在 README 的「Google 日曆設定」。</div>' : ''}
      <section class="panel">
        <div class="panel-head"><h2>同步到日曆</h2><span class="small muted">日曆：${esc(S.settings.gcalCalendarId || 'primary')}</span></div>
        <div class="toolbar" style="margin-bottom:10px">
          <label class="small"><input type="checkbox" data-inc="milestones" ${inc.milestones !== false ? 'checked' : ''}> 里程碑</label>
          <label class="small"><input type="checkbox" data-inc="tasks" ${inc.tasks !== false ? 'checked' : ''}> 任務截止日</label>
          <label class="small"><input type="checkbox" data-inc="followups" ${inc.followups !== false ? 'checked' : ''}> 追回覆的日子</label>
        </div>
        <p style="margin-top:0"><span class="light-pill ${PMO.gcal.connected() ? 'ok' : 'none'}">${PMO.gcal.connected() ? '已連接' : '尚未連接'}</span></p>
        <p style="margin-top:0">待同步：${pending.length} 項・已對應到日曆：${mapped} 項</p>
        <div class="actions">
          <button class="btn" data-act="connect" ${!hasId || isFile ? 'disabled' : ''}>${PMO.gcal.connected() ? '重新授權' : '連接 Google'}</button>
          <button class="btn primary" data-act="sync" ${!hasId || isFile ? 'disabled' : ''}>同步未完成的項目</button>
          <button class="btn" data-act="sync-all" ${!hasId || isFile ? 'disabled' : ''}>連已完成的一起同步</button>
          <button class="btn ghost" data-act="ics">改用 .ics 檔匯出</button>
          <button class="btn ghost danger" data-act="remove-all" ${!hasId || isFile || !mapped ? 'disabled' : ''}>${removeArmed ? '再按一次：確定移除' : '從日曆移除同步過的事件'}</button>
        </div>
        ${lastResult ? `<div class="notice ${lastResult.ok ? 'ok' : ''}" style="margin-top:12px"><b>${lastResult.ok ? '完成' : '沒有完成'}</b> ${esc(lastResult.text)} <button class="btn sm ghost" data-act="clear-msg">關閉</button></div>` : ''}

      </section>
      <section class="panel">
        <div class="panel-head"><h2>接下來兩週</h2><button class="btn sm" data-act="refresh" ${!hasId || isFile ? 'disabled' : ''}>重新整理</button></div>
        ${evHtml}
      </section>`;

  function mount(root) {
    // Load Google's sign-in script now, so tapping "連接 Google" can open the popup immediately (phones block late popups).
    PMO.gcal.prepare().catch(err => { lastResult = { ok: false, text: err.message }; });
    root.onchange = e => {

      if (act === 'ics') { PMO.backup.exportICS(); ui.toast('已下載 .ics 檔，可以匯入 Google、Outlook 或 Apple 日曆'); return; }
      a.disabled = true;
      try {
        if (act === 'connect') {

          lastResult = { ok: true, text: '已連接 Google 日曆，可以開始同步了。' };
          ui.toast('已連接 Google 日曆');
          events = await PMO.gcal.upcoming(14);
        }
        if (act === 'sync' || act === 'sync-all') {
          ui.toast('同步中…');
          const r = await PMO.gcal.sync({ includeDone: act === 'sync-all' });
          lastResult = r.failed
            ? { ok: false, text: `新增 ${r.created}、更新 ${r.updated}，有 ${r.failed} 個沒有同步成功。原因：${r.firstError}` }

          events = await PMO.gcal.upcoming(14);
        }
        if (act === 'refresh') events = await PMO.gcal.upcoming(14);
        if (act === 'remove-all') {
          removeArmed = false;
          const r = await PMO.gcal.removeAll();
          lastResult = { ok: !r.failed, text: `已從日曆移除 ${r.removed} 個同步過的事件${r.failed ? '，' + r.failed + ' 個沒有移除成功' : ''}。` };

        ui.toast(err.message);
        lastResult = { ok: false, text: err.message };

      PMO.app.render();
    };
  }

  return { render, mount };
})();

/* AI consultation chat. Conversation lives in memory only; nothing is kept after you close the tab. */
PMO.views = PMO.views || {};

PMO.views.ai = (function () {
  const S = PMO.store;
  const { esc } = PMO.util;
  const ui = PMO.ui;
  const messages = [];
  let scope = 'none';
  let busy = false;

  const PROMPTS = [
    '幫我把這週的進度整理成給主管的三點重點',
    '依我的待辦，今天和這週應該先做哪幾件？為什麼？',
    '幫我替這個單位想三個領先指標和兩個落後指標',
    '這個單位最需要先處理的風險是什麼？',
    '我想跟事業單位要資料，怎麼開口比較不會讓對方有壓力？',
    '主管說我太直接，這句話可以怎麼換個說法：',
    '這件事要做成 OKR，目標和關鍵結果可以怎麼寫？',
    '幫我列出下次對齊會要確認的問題'
  ];

  function render() {
    const hasKey = PMO.ai.ready();
    const opts = [{ v: 'none', l: '不附資料' }, { v: 'all', l: '附上全部單位摘要' }]
      .concat(S.activeBus().map(b => ({ v: b.id, l: '附上：' + b.name })));
    const html = `
      <div class="page-head"><div><h1>AI 諮詢</h1><p>目前使用：${esc(PMO.ai.providerLabel())}。對話不會存檔，關掉分頁就清空。</p></div>
        <div class="actions"><button class="btn" data-act="clear" ${messages.length ? '' : 'disabled'}>清除對話</button></div></div>
      ${!hasKey ? '<div class="notice"><b>還沒設定 AI 服務。</b> 到「設定」選擇服務並填入金鑰後就能使用。</div>' : ''}
      <div class="notice"><b>送出前想一下：</b> 附上的資料會傳到你選的 AI 服務。公司機密、個資或尚未公開的數字不要放進來；如果公司有核准的 AI 服務，優先用公司的。</div>
      <section class="panel stack">
        <div class="field" style="margin:0"><label for="ai-scope">要附上的工作台資料</label>
          <select id="ai-scope">${opts.map(o => `<option value="${esc(o.v)}" ${o.v === scope ? 'selected' : ''}>${esc(o.l)}</option>`).join('')}</select></div>
        <div class="chips">${PROMPTS.map((p, i) => `<button class="chip" data-act="prompt" data-i="${i}">${esc(p)}</button>`).join('')}</div>
        <div class="chat" id="chat">${messages.length ? messages.map(m => `<div class="msg ${m.role.startsWith('user') ? 'user' : m.role === 'error' ? 'error' : 'assistant'}">${esc(m.content)}</div>`).join('')
          : '<p class="empty">從上面選一個問題，或直接輸入。</p>'}
          ${busy ? '<div class="msg assistant muted">思考中…</div>' : ''}</div>
        <form class="chat-input" id="ai-form">
          <textarea id="ai-text" placeholder="輸入你的問題，Enter 換行，按送出" aria-label="問題"></textarea>
          <button class="btn primary" type="submit" ${busy || !hasKey ? 'disabled' : ''}>送出</button>
        </form>
      </section>`;
    return { title: 'AI 諮詢', html };
  }

  async function send(text) {
    if (!text.trim() || busy) return;
    messages.push({ role: 'user', content: text.trim() });
    busy = true;
    PMO.app.render();
    try {
      const context = scope === 'none' ? '' : PMO.ai.snapshot(scope);
      const history = messages.filter(m => m.role === 'user' || m.role === 'assistant');
      const reply = await PMO.ai.ask(history, { context });
      messages.push({ role: 'assistant', content: reply || '（沒有回覆內容）' });
    } catch (e) {
      messages.push({ role: 'error', content: e.message });
      // Drop the failed question from the history sent next time, but keep it visible.
      const last = messages.length - 2;
      if (messages[last] && messages[last].role === 'user') messages[last].role = 'user-failed';
    }
    busy = false;
    PMO.app.render();
    const chat = document.getElementById('chat');
    if (chat) chat.lastElementChild && chat.lastElementChild.scrollIntoView({ block: 'nearest' });
  }

  function mount(root) {
    root.querySelector('#ai-scope').onchange = e => { scope = e.target.value; };
    root.querySelector('#ai-form').onsubmit = e => { e.preventDefault(); send(root.querySelector('#ai-text').value); };
    root.onclick = e => {
      const a = e.target.closest('[data-act]');
      if (!a) return;
      if (a.dataset.act === 'prompt') { const ta = root.querySelector('#ai-text'); ta.value = PROMPTS[Number(a.dataset.i)]; ta.focus(); }
      if (a.dataset.act === 'clear') { messages.length = 0; PMO.app.render(); ui.toast('已清除對話'); }
    };
  }

  return { render, mount };
})();

</script>

        </section>`).join('')
        : `<section class="panel"><p class="empty" style="margin:0">還沒有連接。可以先用公開的測試 API 試試看，例如：<br><span class="mono">GET https://api.github.com/repos/github/docs</span></p></section>`}`;
    return { title: 'API 連接', html };

  async function edit(c) {
    const cur = c || {};

      fields: [
        { name: 'name', label: '名稱', value: cur.name, required: true, placeholder: '例如：KPI 系統' },
        { name: 'method', label: '方法', type: 'select', value: cur.method || 'GET', row: true,
          options: ['GET', 'POST', 'PUT', 'PATCH'].map(m => ({ value: m, label: m })) },
        { name: 'url', label: '網址', type: 'url', value: cur.url, required: true, placeholder: 'https://…', row: true },
        { name: 'headers', label: 'Headers（JSON）', type: 'textarea', value: cur.headers, placeholder: '{"Authorization": "Bearer …"}', hint: '只存在這台電腦，匯出備份時會自動清掉。' },
        { name: 'body', label: 'Body（POST/PUT 用）', type: 'textarea', value: cur.body, placeholder: '{"key": "value"}' }
      ]
    });
    if (!r) return;
    const list = PMO.connectors.list();
    if (r === 'delete') S.settings.connectors = list.filter(x => x.id !== cur.id);
    else S.upsert(list, Object.assign({ id: cur.id || uid('c') }, r));
    S.saveSettings();
    PMO.app.render();
  }

  function mount(root) {
    root.onclick = async e => {
      const a = e.target.closest('[data-act]');

      const c = PMO.connectors.list().find(x => x.id === a.dataset.id);
      if (a.dataset.act === 'new') return edit(null);

      if (!c) return;
      a.disabled = true;
      try {

          summary: (res.ok ? '成功' : '失敗') + '・HTTP ' + res.status + '・' + res.ms + ' ms',

        };
      } catch (err) {
        results[c.id] = { ok: false, summary: err.message, body: '' };
      }
      PMO.app.render();
    };
  }

  return { render, mount };
})();

                  ${[['bearer', 'Authorization: Bearer（OpenAI、Gemini）'], ['api-key', 'api-key 標頭（Azure）'], ['none', '不需要（本機 Ollama）']].map(([v, l]) => `<option value="${v}" ${s.openaiAuth === v ? 'selected' : ''}>${l}</option>`).join('')}
                </select></div>
              <div class="field"><label for="s_omodel">模型名稱</label>
                <input type="text" id="s_omodel" name="openaiModel" value="${esc(s.openaiModel)}" placeholder="Azure 可留空"></div>
            </div>
            <div class="field"><label for="s_okey">API key</label>
              <input type="password" id="s_okey" name="openaiKey" value="${esc(s.openaiKey)}" autocomplete="off"></div>
            <div class="hint">從瀏覽器直接呼叫時，服務必須允許跨網域（CORS）。OpenAI、Gemini 一般可以；公司的 Azure 或內部閘道要問 IT 是否開放。</div>
          </div>

          <div class="field" style="margin-top:12px"><label for="s_note">給 AI 的補充背景</label>
            <textarea id="s_note" name="aiSystemNote" placeholder="例如：主管偏好結論先講、一頁報告；我正在練習說話力道從輕開始。">${esc(s.aiSystemNote)}</textarea>
            <div class="hint">每次諮詢都會附上這段文字，不要放機密。</div></div>
        </section>

        <div class="actions"><button class="btn primary" type="submit">儲存設定</button>
          <button class="btn ghost" type="button" data-act="forget-key">清除所有 AI 金鑰</button></div>
      </form>`;
    return { title: '設定', html };
  }

  function mount(root) {
    const f = root.querySelector('#settings-form');
    f.elements.aiProvider.onchange = e => {
      const claude = e.target.value === 'claude';
      root.querySelector('#claude-fields').hidden = !claude;
      root.querySelector('#openai-fields').hidden = claude;
    };
    f.onsubmit = e => {
      e.preventDefault();
      ['theme', 'googleClientId', 'gcalCalendarId', 'aiProvider', 'claudeKey', 'claudeModel', 'openaiUrl', 'openaiAuth', 'openaiModel', 'openaiKey', 'aiSystemNote']
        .forEach(k => { S.settings[k] = f.elements[k].value.trim(); });
      if (!S.settings.gcalCalendarId) S.settings.gcalCalendarId = 'primary';
      if (!S.settings.claudeModel) S.settings.claudeModel = 'claude-sonnet-5-5';
      S.saveSettings();
      PMO.app.applyTheme();
      ui.toast('已儲存設定');
    };
    root.onclick = async e => {
      const a = e.target.closest('[data-act]');
      if (!a) return;
      const act = a.dataset.act;
      if (act === 'copy-origin') { const ok = await PMO.util.copy(location.origin); ui.toast(ok ? '已複製：' + location.origin : '複製失敗，請手動選取'); }
      if (act === 'preset') {
        const p = PMO.ai.PRESETS[a.dataset.k];
        f.elements.openaiUrl.value = p.url; f.elements.openaiModel.value = p.model; f.elements.openaiAuth.value = p.auth;
        ui.toast('已套用 ' + p.label + '，記得按儲存');
      }
      if (act === 'forget-key') { S.settings.claudeKey = ''; S.settings.openaiKey = ''; S.saveSettings(); ui.toast('已清除 AI 金鑰'); PMO.app.render(); }
      if (act === 'notify-on') {
        try { await PMO.notify.enable(); ui.toast('已開啟提醒'); } catch (err) { ui.toast(err.message); }
        PMO.app.render();
      }
      if (act === 'notify-off') { PMO.notify.disable(); ui.toast('已關閉提醒'); PMO.app.render(); }
      if (act === 'notify-test') {
        const n = PMO.notify.dueItems().length;
        try { localStorage.removeItem('pmo.notified'); } catch (_) { /* ignore */ } PMO.notify.check();
        ui.toast(n ? '有 ' + n + ' 件到期，已送出通知' : '目前沒有到期的事');
      }
    };
  }

  return { render, mount };
})();

/* ---- js/views/quotes.js ---- */
/* 格言：daily principle card helpers + the browse/manage page. */
PMO.views = PMO.views || {};

PMO.quotes = (function () {
  const S = PMO.store;
  const Q = PMO.quotesData;
  const { esc, today, uid } = PMO.util;
  let shift = 0;

  function prefs() {
    const d = S.data;
    d.quotePrefs = Object.assign({ off: [], favs: [], todaySource: 'all' }, d.quotePrefs || {});
    return d.quotePrefs;
  }
  function all() { return Q.LIST.concat((S.data.quotes || []).map(q => Object.assign({ source: 'mine' }, q))); }
  function sourceName(id) { const s = Q.SOURCES.find(x => x.id === id); return s ? s.name : id; }
  function pool() {
    const p = prefs();
    let list = all().filter(q => !p.off.includes(q.source));
    if (p.todaySource === 'favs') list = all().filter(q => p.favs.includes(q.id));
    else if (p.todaySource !== 'all') list = all().filter(q => q.source === p.todaySource);
    return list;
  }
  function hash(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }
  function pick() {
    const list = pool();
    if (!list.length) return null;
    return list[(hash(today()) + shift) % list.length];
  }

  function card() {
    const p = prefs();
    const q = pick();
    const fav = q && p.favs.includes(q.id);
    const opts = [{ v: 'all', l: '全部來源' }, { v: 'favs', l: '只看收藏' }].concat(Q.SOURCES.map(s => ({ v: s.id, l: s.name })));
    return `<section class="panel quote-card">
      <div class="panel-head"><h2>今日格言</h2>
        <select id="quote-source" aria-label="格言來源">${opts.map(o => `<option value="${o.v}" ${o.v === p.todaySource ? 'selected' : ''}>${esc(o.l)}</option>`).join('')}</select></div>
      ${q ? `<blockquote class="quote-text">${esc(q.text)}</blockquote>
        <div class="quote-meta"><span class="small muted">— ${esc(sourceName(q.source))}</span>${q.tip ? `<span class="small">今天可以試：${esc(q.tip)}</span>` : ''}</div>
        <div class="actions"><button class="btn sm" data-act="quote-next">換一則</button>
          <button class="btn sm ghost" data-act="quote-fav" data-id="${esc(q.id)}" aria-pressed="${fav}">${fav ? '★ 已收藏' : '☆ 收藏'}</button>
          <a class="btn sm ghost" href="#/quotes">全部格言</a></div>`
        : '<p class="empty">這個來源還沒有格言。到「全部格言」可以自己新增。</p>'}
    </section>`;
  }

  // Handles the card's controls on any page; returns true when it handled the event.
  function handle(e) {
    const a = e.target.closest('[data-act]');
    if (!a) return false;
    if (a.dataset.act === 'quote-next') { shift++; PMO.app.render(); return true; }
    if (a.dataset.act === 'quote-fav') { toggleFav(a.dataset.id); PMO.app.render(); return true; }
    return false;
  }
  function bindSelect(root) {
    const sel = root.querySelector('#quote-source');
    if (sel) sel.onchange = e => { prefs().todaySource = e.target.value; shift = 0; S.save(); PMO.app.render(); };
  }
  function toggleFav(id) {
    const p = prefs();
    p.favs = p.favs.includes(id) ? p.favs.filter(x => x !== id) : p.favs.concat([id]);
    S.save();
  }

  async function edit(existing) {
    const cur = existing || {};
    const r = await PMO.ui.form({
      title: existing ? '編輯格言' : '新增我的格言',
      allowDelete: !!existing,
      fields: [
        { name: 'text', label: '內容', type: 'textarea', value: cur.text, required: true },
        { name: 'author', label: '出處（人名或書名）', value: cur.author, placeholder: '例如：讀書筆記、主管說過的話' },
        { name: 'tip', label: '今天可以怎麼用（選填）', value: cur.tip }
      ]
    });
    if (!r) return;
    S.data.quotes = S.data.quotes || [];
    if (r === 'delete') S.data.quotes = S.data.quotes.filter(q => q.id !== cur.id);
    else S.upsert(S.data.quotes, Object.assign({ id: cur.id || uid('q') }, r));
    S.save();
  }

  return { card, handle, bindSelect, prefs, all, sourceName, toggleFav, edit };
})();

PMO.views.quotes = (function () {
  const S = PMO.store;
  const Q = PMO.quotesData;
  const { esc } = PMO.util;
  let filter = 'all';

  function render() {
    const p = PMO.quotes.prefs();
    const list = PMO.quotes.all().filter(q => filter === 'all' || (filter === 'favs' ? p.favs.includes(q.id) : q.source === filter));
    const html = `
      <div class="page-head"><div><h1>格言</h1><p>每天在「今天」頁輪播一則。可以只看某位作者、只看收藏，也可以加上自己的。</p></div>
        <div class="actions"><button class="btn primary" data-act="add">＋ 我的格言</button></div></div>
      <p class="hint" style="margin:0">書籍類的內容是用自己的話整理的重點，不是原文引用；《孫子兵法》為原文。想收錄書中的原句，可以用「我的格言」自己加。</p>
      <section class="panel">
        <h2>每日輪播要包含哪些來源</h2>
        <div class="source-toggles">${Q.SOURCES.map(s => `<label class="source-toggle"><input type="checkbox" data-src="${s.id}" ${p.off.includes(s.id) ? '' : 'checked'}>
          <span><b>${esc(s.name)}</b><br><span class="small muted">${esc(s.sub)}</span></span></label>`).join('')}</div>
      </section>
      <div class="toolbar"><div class="chips">
        ${[{ v: 'all', l: '全部' }, { v: 'favs', l: '★ 收藏' }].concat(Q.SOURCES.map(s => ({ v: s.id, l: s.name }))).map(o =>
          `<button class="chip ${filter === o.v ? 'on' : ''}" data-act="filter" data-v="${o.v}">${esc(o.l)}</button>`).join('')}
      </div></div>
      <section class="panel">
        ${list.length ? `<ul class="list">${list.map(q => {
          const fav = p.favs.includes(q.id);
          return `<li><span class="grow"><span class="quote-line">${esc(q.text)}</span>
            <span class="row-meta"><span class="small muted">— ${esc(q.source === 'mine' && q.author ? q.author : PMO.quotes.sourceName(q.source))}</span>${q.tip ? `<span class="small">今天可以試：${esc(q.tip)}</span>` : ''}</span></span>
            <span class="row-actions"><button class="btn sm ghost" data-act="fav" data-id="${esc(q.id)}" aria-pressed="${fav}">${fav ? '★' : '☆'}</button>
            ${q.source === 'mine' ? `<button class="btn sm ghost" data-act="edit" data-id="${esc(q.id)}">編輯</button>` : ''}</span></li>`;
        }).join('')}</ul>` : '<p class="empty">沒有符合的格言。</p>'}
      </section>`;
    return { title: '格言', html };
  }

  function mount(root) {
    root.onchange = e => {
      const c = e.target.closest('[data-src]');
      if (!c) return;
      const p = PMO.quotes.prefs();
      p.off = c.checked ? p.off.filter(x => x !== c.dataset.src) : p.off.concat([c.dataset.src]);
      S.save();
    };
    root.onclick = async e => {
      const a = e.target.closest('[data-act]');
      if (!a) return;
      if (a.dataset.act === 'filter') { filter = a.dataset.v; PMO.app.render(); }
      if (a.dataset.act === 'fav') { PMO.quotes.toggleFav(a.dataset.id); PMO.app.render(); }
      if (a.dataset.act === 'add') { await PMO.quotes.edit(null); PMO.app.render(); }
      if (a.dataset.act === 'edit') { await PMO.quotes.edit((S.data.quotes || []).find(q => q.id === a.dataset.id)); PMO.app.render(); }
    };
  }

  return { render, mount };
})();

  <script>
/* ---- js/views/schedule.js ---- */
/* 行事曆：month grid with everything that has a date, the selected day's list, and this week's schedule.
   Sources: tasks (due), milestones, follow-ups (chase date), routines (every occurrence), and Google Calendar events when connected. */
PMO.views = PMO.views || {};

PMO.views.schedule = (function () {
  const S = PMO.store;
  const P = PMO.parts;
  const { esc, today, addDays, parseDate, pad, fmtDate } = PMO.util;
  const ui = PMO.ui;
  const WD = ['一', '二', '三', '四', '五', '六', '日'];
  const KIND = {
    task: '任務', ms: '里程碑', follow: '追回覆', routine: '例行', google: '日曆'
  };

  let cursor = today().slice(0, 7);   // YYYY-MM shown in the grid
  let selected = today();
  // On Saturday and Sunday the coming week is more useful than the one that is ending.
  let weekShift = [0, 6].includes(new Date().getDay()) ? 1 : 0;
  const gCache = {};                  // 'from|to' -> events
  let gLoading = false;
  let gError = '';
  let hScope = 'month';               // holiday list: 'month' shown in the grid, or the whole 'year'
  let hOnlyOff = false;               // only days off, no observances
  let hOpen = null;                   // holiday panel open; null = open when a country is chosen
  let gFailedKey = '';               // range that last failed; not retried until 重新讀取日曆

  const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  function mondayOf(dateStr) { const d = parseDate(dateStr); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return ymd(d); }

  function gridRange() {
    const first = cursor + '-01';
    const start = mondayOf(first);
    const lastDay = new Date(Number(cursor.slice(0, 4)), Number(cursor.slice(5, 7)), 0);
    const end = addDays(mondayOf(ymd(lastDay)), 6);
    return { start, end };
  }

  function routineDates(r, from, to) {
    const out = [];
    let probe = Object.assign({}, r);
    for (let i = 0; i < 60; i++) {
      const next = S.routineNext(probe);
      if (!next || next > to) break;
      if (next >= from) out.push(next);
      probe = Object.assign({}, r, { lastDone: next });
    }
    return out;
  }

  /* All dated items between two dates, as { date, kind, sort, ...ref }. */
  function collect(from, to) {
    const d = S.data;
    const out = [];
    const inR = x => x && x >= from && x <= to;
    d.tasks.forEach(t => { if (t.triaged !== false && inR(t.due)) out.push({ date: t.due, kind: 'task', ref: t, done: t.status === 'done' }); });
    S.allMilestones().forEach(x => { if (inR(x.m.date)) out.push({ date: x.m.date, kind: 'ms', ref: x, done: x.m.done }); });
    d.followups.forEach(f => { if (f.status === 'waiting' && inR(f.nudgeOn)) out.push({ date: f.nudgeOn, kind: 'follow', ref: f }); });
    d.routines.forEach(r => routineDates(r, from, to).forEach(dt => out.push({ date: dt, kind: 'routine', ref: r })));
    const g = gCache[from + '|' + to] || gCache[gKey()] || [];
    g.forEach(e => { if (!e.fromPmo && inR(e.date)) out.push({ date: e.date, kind: 'google', ref: e, time: e.time }); });
    const order = { google: 0, ms: 1, task: 2, follow: 3, routine: 4 };
    return out.sort((a, b) => a.date.localeCompare(b.date) || (a.time || '').localeCompare(b.time || '') || order[a.kind] - order[b.kind]);
  }

  function gKey() { const r = gridRange(); const w = addDays(mondayOf(selected), weekShift * 7); const s = w < r.start ? w : r.start; const e = addDays(w, 6) > r.end ? addDays(w, 6) : r.end; return s + '|' + e; }

  function loadGoogle() {
    if (!PMO.gcal.connected() || gLoading) return;
    const key = gKey();
    if (gCache[key] || gFailedKey === key) return;
    const [from, to] = key.split('|');
    gLoading = true; gError = '';
    PMO.gcal.range(from, to).then(evs => { gCache[key] = evs; gFailedKey = ''; }).catch(err => {
      gFailedKey = key;
      gError = err.status === 404 ? '找不到這個日曆。請到「設定」檢查日曆 ID（用主日曆就填 primary）。'
        : err.status === 403 ? '沒有讀取這個日曆的權限，或 Google Calendar API 還沒啟用。'
        : err.message;
    })
      .finally(() => { gLoading = false; if (location.hash.startsWith('#/schedule')) PMO.app.render(); });
  }

  function itemRow(it) {
    if (it.kind === 'task') return P.taskRow(it.ref);
    if (it.kind === 'follow') return P.followRow(it.ref);
    if (it.kind === 'routine') return P.routineRow(it.ref);
    if (it.kind === 'ms') {
      const { m, p } = it.ref;
      return `<li><span class="kind-dot k-ms" aria-hidden="true"></span>
        <span class="grow ${m.done ? 'done-text' : ''}">${esc(m.title)}<span class="row-meta"><span class="pill tag">里程碑</span>${P.unitTag(p.buId)}<a class="small" href="#/project/${esc(p.id)}">${esc(p.name)}</a></span></span></li>`;
    }
    const e = it.ref;
    return `<li><span class="kind-dot k-google" aria-hidden="true"></span>
      <span class="date">${e.allDay ? '整天' : esc(e.time)}</span>
      <span class="grow">${esc(e.title)}<span class="row-meta"><span class="small muted">Google 日曆</span>${e.link ? `<a class="small" href="${esc(e.link)}" target="_blank" rel="noopener">在日曆打開</a>` : ''}</span></span></li>`;
  }

  function dayLabel(dt) {
    const d = parseDate(dt);
    const n = PMO.util.daysBetween(today(), dt);
    const rel = n === 0 ? '今天' : n === 1 ? '明天' : n === -1 ? '昨天' : '';
    return fmtDate(dt).slice(5) + '（週' + WD[(d.getDay() + 6) % 7] + '）' + (rel ? '・' + rel : '');
  }

  /* 各國假期: its own panel with a country menu, kept out of the month grid. */
  function holidayPanel(t) {
    const H = PMO.holidays;
    const region = H.current();
    const open = hOpen == null ? !!region : hOpen;
    const year = cursor.slice(0, 4);
    const groups = [];
    H.regions().forEach(([id, name, g]) => {
      let grp = groups.find(x => x.g === g);
      if (!grp) groups.push(grp = { g, list: [] });
      grp.list.push([id, name]);
    });
    const menu = `<select id="h-region" aria-label="選擇國家或地區">
        <option value="">不顯示假期</option>
        ${groups.map(grp => `<optgroup label="${esc(grp.g)}">${grp.list.map(([id, name]) => `<option value="${esc(id)}" ${id === region ? 'selected' : ''}>${esc(name)}</option>`).join('')}</optgroup>`).join('')}
      </select>`;
    const pins = H.pins();
    const chips = pins.length ? `<div class="chips">${pins.map(r => `<button type="button" class="chip ${r === region ? 'on' : ''}" data-act="h-pick" data-r="${esc(r)}">${esc(H.nameOf(r))}</button>`).join('')}</div>` : '';

    let body = '';
    if (!region) body = '<p class="empty">從選單選一個國家，就會列出那裡的假期。不會放進上面的月曆。</p>';
    else {
      const list = H.cached(region, year);
      const err = H.error(region, year);
      if (!list) {
        body = H.isLoading(region, year) ? '<p class="empty">正在讀取假期…</p>'
          : err ? `<p class="empty">讀不到假期：${esc(err)} <button class="btn sm ghost" data-act="h-retry">再試一次</button></p>`
          : !S.settings.googleClientId ? '<p class="empty">假期是從 Google 的公開假期日曆讀的，要先到「設定」填 Google Client ID。</p>'
          : '<p class="empty">假期是從 Google 的公開假期日曆讀的。連接一次 Google 之後，會記在這個瀏覽器 30 天。 <button class="btn sm" data-act="connect">連接 Google</button></p>';
      } else {
        const shown = list.filter(h => (hScope === 'year' || h.date.slice(0, 7) === cursor) && (!hOnlyOff || h.off));
        body = shown.length ? `<ul class="list holiday-list">${shown.map(h => `<li class="${h.date < t ? 'past' : ''}">
            <button type="button" class="date" data-act="h-day" data-d="${h.date}">${fmtDate(h.date).slice(5)}（${WD[(parseDate(h.date).getDay() + 6) % 7]}）</button>
            <span class="grow">${esc(h.title)}</span>${h.off ? '<span class="pill tag">放假</span>' : ''}</li>`).join('')}</ul>`
          : `<p class="empty">${hScope === 'year' ? year + ' 年' : Number(cursor.slice(5)) + ' 月'}沒有${hOnlyOff ? '放假的' : ''}假期。</p>`;
      }
    }

    return `<section class="panel holiday-panel">
      <div class="panel-head"><h2>各國假期${region ? '・' + esc(H.nameOf(region)) : ''}</h2>
        <button class="btn sm ghost" data-act="h-toggle" aria-expanded="${open}">${open ? '收起' : '展開'}</button></div>
      ${open ? `<div class="toolbar holiday-tools">
          ${menu}
          ${region ? `<button class="btn sm ghost" data-act="h-pin">${pins.includes(region) ? '取消常用' : '加到常用'}</button>` : ''}
        </div>
        ${chips}
        ${region ? `<div class="toolbar holiday-tools">
          <div class="seg" role="group" aria-label="範圍">
            <button type="button" class="${hScope === 'month' ? 'on' : ''}" data-act="h-scope" data-s="month">${Number(cursor.slice(5))} 月</button>
            <button type="button" class="${hScope === 'year' ? 'on' : ''}" data-act="h-scope" data-s="year">${year} 全年</button>
          </div>
          <label class="small"><input type="checkbox" id="h-off" ${hOnlyOff ? 'checked' : ''}> 只看放假日</label>
        </div>` : ''}
        ${body}` : ''}
    </section>`;
  }

  function render() {
    const t = today();
    const { start, end } = gridRange();
    const weekStart = addDays(mondayOf(selected), weekShift * 7);
    const weekEnd = addDays(weekStart, 6);
    const all = collect(start < weekStart ? start : weekStart, end > weekEnd ? end : weekEnd);
    const byDate = {};
    all.forEach(it => { (byDate[it.date] = byDate[it.date] || []).push(it); });

    const cells = [];
    for (let dt = start; dt <= end; dt = addDays(dt, 1)) {
      const items = byDate[dt] || [];
      const kinds = [...new Set(items.map(i => i.kind))].slice(0, 4);
      const inMonth = dt.slice(0, 7) === cursor;
      cells.push(`<button type="button" class="cal-cell ${inMonth ? '' : 'out'} ${dt === t ? 'is-today' : ''} ${dt === selected ? 'is-sel' : ''}"
        data-act="pick" data-d="${dt}" aria-label="${dayLabel(dt)}，${items.length} 項" aria-pressed="${dt === selected}">
        <span class="cal-num">${Number(dt.slice(8))}</span>
        <span class="cal-dots">${kinds.map(k => `<i class="kind-dot k-${k}"></i>`).join('')}</span>
        ${items.length ? `<span class="cal-count">${items.length}</span>` : ''}</button>`);
    }

    const dayItems = byDate[selected] || [];
    const week = [];
    for (let i = 0; i < 7; i++) week.push(addDays(weekStart, i));
    const weekCount = week.reduce((n, dt) => n + (byDate[dt] || []).length, 0);
    const [y, m] = cursor.split('-');

    const gNote = !S.settings.googleClientId ? '還沒設定 Google 日曆，目前只顯示工作台裡的項目。'
      : !PMO.gcal.connected() ? '尚未連接 Google，所以沒有顯示 Google 日曆上的行程。'
      : gLoading ? '正在讀取 Google 日曆…' : gError ? 'Google 日曆讀取失敗：' + gError + ' 工作台裡的項目照常顯示。' : '';

    const H = PMO.holidays;
    const region = H.current();
    const dh = region ? H.on(region, selected) : [];
    const dayHolidays = dh.length ? `<p class="holiday-note"><span class="pill tag">${esc(H.nameOf(region))}假期</span> ${dh.map(h => esc(h.title)).join('、')}</p>` : '';

    const html = `
      <div class="page-head"><div><h1>行事曆</h1><p>工作台裡有日期的事情${PMO.gcal.connected() ? '和 Google 日曆上的行程' : ''}都在這裡。點一天看當天的安排。</p></div>
        <div class="actions">${S.settings.googleClientId && !PMO.gcal.connected() ? '<button class="btn" data-act="connect">連接 Google</button>' : ''}
          ${PMO.gcal.connected() ? '<button class="btn" data-act="reload">重新讀取日曆</button>' : ''}</div></div>
      ${gNote ? `<p class="hint" style="margin:0">${esc(gNote)}</p>` : ''}

      <section class="panel cal">
        <div class="cal-head">
          <button class="btn sm ghost" data-act="prev" aria-label="上個月">‹</button>
          <h2>${y} 年 ${Number(m)} 月</h2>
          <button class="btn sm ghost" data-act="next" aria-label="下個月">›</button>
          <button class="btn sm" data-act="today">今天</button>
        </div>
        <div class="cal-grid" role="grid">
          ${WD.map(w => `<div class="cal-wd">${w}</div>`).join('')}
          ${cells.join('')}
        </div>
        <div class="cal-legend">${Object.keys(KIND).map(k => `<span><i class="kind-dot k-${k}"></i>${KIND[k]}</span>`).join('')}</div>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>${dayLabel(selected)}</h2><button class="btn sm" data-act="add-task">＋ 這天的任務</button></div>
        ${dayHolidays}
        ${dayItems.length ? `<ul class="list">${dayItems.map(itemRow).join('')}</ul>` : '<p class="empty">這天沒有安排。</p>'}
      </section>

      <section class="panel">
        <div class="panel-head"><h2>${weekStart <= t && t <= weekEnd ? '這一週' : weekStart > t ? (weekShift === 1 || mondayOf(t) === addDays(weekStart, -7) ? '下一週' : '之後的一週') : '之前的一週'}（${fmtDate(weekStart).slice(5)}–${fmtDate(weekEnd).slice(5)}）</h2>
          <div class="actions"><span class="small muted">${weekCount} 項</span>
            <button class="btn sm ghost" data-act="wprev" aria-label="上一週">‹</button>
            <button class="btn sm ghost" data-act="wnext" aria-label="下一週">›</button></div></div>
        <div class="week">
          ${week.map(dt => {
            const items = byDate[dt] || [];
            return `<div class="week-day ${dt === t ? 'is-today' : ''} ${items.length ? '' : 'is-empty'}">
              <button type="button" class="week-label" data-act="pick" data-d="${dt}">${dayLabel(dt)}</button>
              ${items.length ? `<ul class="list">${items.map(itemRow).join('')}</ul>` : '<span class="small muted">沒有安排</span>'}
            </div>`;
          }).join('')}
        </div>
      </section>
      ${holidayPanel(t)}`;
    return { title: '行事曆', html };
  }

  function mount(root) {
    PMO.gcal.prepare().catch(() => {});
    loadGoogle();
    PMO.holidays.ensure(PMO.holidays.current(), cursor.slice(0, 4), () => { if (location.hash.startsWith('#/schedule')) PMO.app.render(); });
    root.onchange = e => {
      if (e.target.id === 'h-region') { PMO.holidays.setCurrent(e.target.value); hOpen = true; PMO.app.render(); }
      if (e.target.id === 'h-off') { hOnlyOff = e.target.checked; PMO.app.render(); }
    };
    root.onclick = async e => {
      if (await P.handle(e)) return;
      const a = e.target.closest('[data-act]');
      if (!a) return;
      const act = a.dataset.act;
      if (act === 'h-toggle') { hOpen = !(hOpen == null ? !!PMO.holidays.current() : hOpen); PMO.app.render(); return; }
      if (act === 'h-pick') { PMO.holidays.setCurrent(a.dataset.r); hOpen = true; PMO.app.render(); return; }
      if (act === 'h-pin') { PMO.holidays.togglePin(PMO.holidays.current()); PMO.app.render(); return; }
      if (act === 'h-scope') { hScope = a.dataset.s; PMO.app.render(); return; }
      if (act === 'h-retry') { PMO.holidays.retry(PMO.holidays.current(), cursor.slice(0, 4)); PMO.app.render(); return; }
      if (act === 'h-day') { selected = a.dataset.d; cursor = selected.slice(0, 7); weekShift = 0; PMO.app.render(); return; }
      if (act === 'wprev' || act === 'wnext') { weekShift += act === 'wnext' ? 1 : -1; PMO.app.render(); return; }
      if (act === 'pick') { weekShift = 0; selected = a.dataset.d; if (selected.slice(0, 7) !== cursor) cursor = selected.slice(0, 7); PMO.app.render(); }
      if (act === 'prev' || act === 'next') {
        const d = new Date(Number(cursor.slice(0, 4)), Number(cursor.slice(5, 7)) - 1 + (act === 'next' ? 1 : -1), 1);
        cursor = ymd(d).slice(0, 7);
        selected = cursor === today().slice(0, 7) ? today() : cursor + '-01';
        PMO.app.render();
      }
      if (act === 'today') { cursor = today().slice(0, 7); selected = today(); weekShift = [0, 6].includes(new Date().getDay()) ? 1 : 0; PMO.app.render(); }
      if (act === 'add-task') { await PMO.edit.task(null, { due: selected }); PMO.app.render(); }
      if (act === 'reload') { Object.keys(gCache).forEach(k => delete gCache[k]); gFailedKey = ''; gError = ''; PMO.app.render(); }
      if (act === 'connect') {
        try { await PMO.gcal.signIn(); ui.toast('已連接 Google 日曆'); } catch (err) { ui.toast(err.message); }
        PMO.app.render();
      }
    };
  }

  return { render, mount };
})();

</script>
  <script>
/* ---- js/app.js ---- */
/* Router and app shell. Routes: #/today (home), #/dashboard, #/tasks, #/followups, #/routines, #/indicators, #/bu/:id, #/project/:id,
   #/questions, #/wins, #/rituals, #/ai, #/calendar, #/connectors, #/backup, #/settings */
PMO.app = (function () {
  const S = PMO.store;
  const { esc } = PMO.util;
  const root = document.getElementById('view');
  const nav = document.getElementById('nav');
  const menuBtn = document.getElementById('menu-btn');

  function parse() {
    const parts = (location.hash.replace(/^#\/?/, '') || 'today').split('/');
    const name = parts[0];
    if (name === 'bu') return { view: 'bu', params: { id: decodeURIComponent(parts[1] || '') } };
    if (name === 'project') return { view: 'project', params: { id: decodeURIComponent(parts[1] || '') } };
    return { view: PMO.views[name] ? name : 'today', params: {} };
  }

  function renderNav(route) {
    document.getElementById('nav-bus').innerHTML = S.activeBus().map(b =>
      `<a href="#/bu/${esc(b.id)}" data-bu="${esc(b.id)}"><span class="dot" style="background:${esc(b.color)}"></span>${esc(b.name)}</a>`).join('');
    let activeBu = null;
    if (route.view === 'bu') activeBu = route.params.id;
    if (route.view === 'project') { const p = S.project(route.params.id); activeBu = p && p.buId; }
    nav.querySelectorAll('a').forEach(a => {
      const on = (a.dataset.nav && a.dataset.nav === route.view) || (a.dataset.bu && a.dataset.bu === activeBu);
      a.classList.toggle('active', !!on);
      if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
  }

  function renderBackupHint() {
    const days = PMO.backup.daysSinceBackup();
    const el = document.getElementById('backup-hint');
    if (days == null || days >= 7) {
      el.innerHTML = `<a href="#/backup">${days == null ? '還沒備份過' : days + ' 天沒備份'}</a>`;
    } else el.innerHTML = '';
  }

  function render() {
    const route = parse();
    const view = PMO.views[route.view];
    let out;
    try {
      out = view.render(route.params);
    } catch (e) {
      console.error(e);
      out = { title: '發生錯誤', html: `<div class="notice"><b>這一頁無法顯示。</b> ${esc(e.message)}。可以先到「備份與匯出」下載備份。</div>` };
    }
    // Keep scroll position when re-rendering the same route.
    const sameRoute = root.dataset.route === location.hash;
    const y = window.scrollY;
    root.onclick = null; root.onchange = null;
    root.innerHTML = out.html;
    root.dataset.route = location.hash;
    document.getElementById('topbar-title').textContent = out.title;
    document.title = out.title === '今天' ? '策略 PMO 工作台' : out.title + '・策略 PMO';
    renderNav(route);
    renderBackupHint();
    if (view.mount) view.mount(root, route.params);
    if (sameRoute) window.scrollTo(0, y); else window.scrollTo(0, 0);
  }

  function applyTheme() {
    const t = S.settings.theme;
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
  }

  const backdrop = document.getElementById('nav-backdrop');
  function setMenu(open) {
    nav.classList.toggle('open', open);
    menuBtn.setAttribute('aria-expanded', String(open));
    backdrop.hidden = !open;
  }
  function closeMenu() { setMenu(false); }

  menuBtn.onclick = () => setMenu(!nav.classList.contains('open'));
  backdrop.onclick = closeMenu;
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && nav.classList.contains('open')) closeMenu(); });
  nav.addEventListener('click', async e => {
    if (e.target.closest('a')) closeMenu();
    if (e.target.closest('[data-action="bu-new"]')) {
      closeMenu();
      const b = await PMO.edit.bu();
      if (b) location.hash = '#/bu/' + b.id;
    }
  });
  window.addEventListener('hashchange', render);
  window.addEventListener('storage', e => { if (e.key === 'pmo.data') location.reload(); });

  applyTheme();
  if (PMO.notify) PMO.notify.start();
  return { render, applyTheme };
})();

PMO.app.render();

</script>
